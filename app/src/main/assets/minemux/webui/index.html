<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineMux</title>
  <link rel="icon" type="image/png" href="/assets/app-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #111;
      --panel-2: #181818;
      --line: #303030;
      --text: #f4f4f4;
      --muted: #a6a6a6;
      --dim: #737373;
      --green: #0db50d;
      --red: #d64040;
      --warn: #c9c9c9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
    aside { border-right: 1px solid var(--line); background: #090909; padding: 18px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; gap: 10px; align-items: center; font-size: 24px; font-weight: 800; margin-bottom: 22px; }
    .logo { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(13,181,13,.45); object-fit: cover; background: #050505; }
    .title-logo { width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(13,181,13,.45); object-fit: cover; background: #050505; }
    nav { display: grid; gap: 8px; }
    .nav { border: 1px solid transparent; color: var(--muted); background: transparent; border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; }
    .nav.active { color: #fff; background: rgba(13,181,13,.16); border-color: rgba(13,181,13,.45); }
    main { padding: 20px; max-width: 1320px; width: 100%; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); line-height: 1; }
    h2 { margin: 0 0 12px; font-size: 19px; }
    h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 650; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .grid { display: grid; gap: 12px; }
    .cols { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; align-items: start; }
    .servers-layout { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 14px; align-items: start; }
    .server-list-card { position: sticky; top: 20px; }
    .server-row { display: grid; gap: 10px; cursor: pointer; }
    .server-row.selected { border-color: var(--green); box-shadow: inset 3px 0 0 var(--green); }
    .server-row-title { font-size: 18px; font-weight: 850; }
    .detail-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
    .detail-hero h2 { margin: 0 0 6px; font-size: 26px; }
    .server-detail-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr); gap: 12px; align-items: start; }
    .server-kv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .mini-card { border: 1px solid var(--line); background: #0b0b0b; border-radius: 14px; padding: 12px; min-height: 74px; }
    .mini-card b { display: block; margin-top: 5px; font-size: 17px; }
    .detail-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
    .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .section-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .inline-note { border: 1px solid rgba(13,181,13,.28); background: rgba(13,181,13,.08); color: #dff5df; border-radius: 14px; padding: 12px; }
    .hint { color: var(--dim); font-size: 12px; line-height: 1.35; }
    .tight-list { display: grid; gap: 6px; }
    .compact-item { padding: 10px; }
    .map-link { color: var(--green); font-weight: 800; text-decoration: none; }
    .metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { background: linear-gradient(180deg, var(--panel), #0c0c0c); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.22); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; background: rgba(166,166,166,.12); color: var(--muted); font-size: 12px; font-weight: 800; }
    .pill.green { background: rgba(13,181,13,.16); color: var(--green); }
    .pill.red { background: rgba(214,64,64,.15); color: #ff7777; }
    .dot { width: 8px; height: 8px; background: currentColor; border-radius: 50%; display: inline-block; }
    .runtime { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: rgba(13,181,13,.12); border: 1px solid rgba(13,181,13,.35); color: var(--green); font-weight: 900; }
    .metric { min-height: 114px; display: grid; align-content: space-between; }
    .metric .value { font-size: 24px; font-weight: 850; }
    .spark { height: 34px; width: 100%; }
    .spark.empty { opacity: .25; }
    .spark svg { width: 100%; height: 34px; display: block; overflow: visible; }
    .spark polygon { fill: rgba(13,181,13,.15); }
    .spark polyline { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 14px; padding: 11px 13px; cursor: pointer; font-weight: 750; }
    button:hover { border-color: var(--green); }
    button.primary { background: var(--green); border-color: var(--green); color: #fff; }
    button.danger { background: var(--red); border-color: var(--red); color: #fff; }
    button:disabled { opacity: .45; cursor: progress; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); background: #080808; color: var(--text); border-radius: 12px; padding: 11px 12px; }
    textarea { min-height: 120px; resize: vertical; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .list { display: grid; gap: 8px; }
    .item { border: 1px solid var(--line); background: #0b0b0b; border-radius: 14px; padding: 12px; }
    .item.active { border-color: var(--green); }
    .console { background: #030303; border: 1px solid var(--line); border-radius: 14px; padding: 12px; height: 280px; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .hidden { display: none !important; }
    .notice { position: fixed; right: 18px; bottom: 18px; max-width: 380px; background: #101010; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 14px; padding: 12px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.35); z-index: 20; }
    .notice.error { border-left-color: var(--red); }
    .file-input { display: none; }
    iframe { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 14px; background: #080808; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { position: fixed; inset: auto 10px 10px; height: auto; z-index: 10; border: 1px solid var(--line); border-radius: 22px; padding: 8px; }
      .brand { display: none; }
      nav { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .nav { text-align: center; padding: 10px 4px; font-size: 11px; }
      main { padding: 16px 12px 92px; }
      .cols, .metrics, .servers-layout, .server-detail-grid { grid-template-columns: 1fr; }
      .server-list-card { position: static; }
      .actions { grid-template-columns: repeat(2, 1fr); }
      .server-kv-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .cols, .metrics, .actions, .detail-hero, .server-kv-grid { grid-template-columns: 1fr; }
      nav { grid-template-columns: repeat(4, 1fr); }
      .nav { font-size: 10px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img class="logo" src="/assets/app-icon.png" alt=""><span>MineMux</span></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <div class="row">
        <img class="title-logo" src="/assets/app-icon.png" alt="">
        <div>
          <h1 id="title">Dashboard</h1>
          <div class="muted" id="subtitle">Phone-hosted Minecraft server control.</div>
        </div>
      </div>
      <div class="row">
        <span class="pill" id="controller-pill"><span class="dot"></span>Loading</span>
        <button id="refresh">Refresh</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="notice" class="notice hidden"></div>
<input id="backup-upload" class="file-input" type="file" accept=".zip">
<input id="server-upload" class="file-input" type="file">
<input id="mod-upload" class="file-input" type="file" accept=".jar">
<input id="server-icon-upload" class="file-input" type="file" accept="image/png">
<input id="resource-pack-upload" class="file-input" type="file" accept=".zip">
<script>
const state = {
  page: "dashboard",
  status: null,
  servers: [],
  backups: [],
  mods: null,
  modsByServer: {},
  files: [],
  fileEditor: null,
  filePath: "",
  selectedServerId: "",
  options: null,
  busy: false,
  renderedPage: "",
  renderedDashboardInstalled: null,
  renderedDashboardRunning: null,
  history: {
    tps: [],
    players: [],
    cpu: [],
    memory: [],
    disk: []
  }
};

const pages = [
  ["dashboard", "Dashboard"],
  ["servers", "Servers"],
  ["backups", "Backups"],
  ["mods", "Mods"],
  ["files", "Files"],
  ["settings", "Settings"],
  ["console", "Console"]
];

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = value => Number(value || 0).toFixed(value > 10 ? 0 : 1) + "%";
const bytes = value => {
  value = Number(value || 0);
  const units = ["B", "KB", "MB", "GB", "TB"];
  let index = 0;
  while (value >= 1024 && index < units.length - 1) { value /= 1024; index++; }
  return `${value.toFixed(index ? 1 : 0)} ${units[index]}`;
};
const q = params => new URLSearchParams(params).toString();
const api = async (path, opts = {}) => {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let error = await res.text();
    try { error = JSON.parse(error).error || error; } catch {}
    throw new Error(error);
  }
  return res.headers.get("content-type")?.includes("application/json") ? res.json() : res.text();
};
const post = (path, body = {}) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const del = path => api(path, { method: "DELETE" });

function notice(message, error = false) {
  const box = $("notice");
  box.textContent = message;
  box.className = "notice" + (error ? " error" : "");
  clearTimeout(notice.timer);
  notice.timer = setTimeout(() => box.classList.add("hidden"), 3800);
}

function runtimeLabel(loader) {
  loader = (loader || "-").toLowerCase();
  if (loader === "neoforge") return "NF";
  if (loader === "vanilla") return "V";
  return loader.slice(0, 1).toUpperCase();
}

function statusLabel(server = {}) {
  if (server.stopping) return ["Stopping", "red"];
  if (server.starting || (server.running && !server.ready)) return ["Starting", "green"];
  if (server.running && server.ready) return ["Running", "green"];
  if (server.installed) return ["Ready", ""];
  return ["Needs setup", "red"];
}

function renderNav() {
  $("nav").innerHTML = pages.map(([id, label]) => `<button class="nav ${state.page === id ? "active" : ""}" data-page="${id}">${label}</button>`).join("");
  document.querySelectorAll(".nav").forEach(button => button.onclick = () => { state.page = button.dataset.page; state.renderedPage = ""; render(); refresh(false); });
}

async function refresh(forceRender = false) {
  try {
    const previousInstalled = state.status?.server?.installed ?? null;
    const previousRunning = state.status?.server?.running ?? null;
    state.status = await api("/api/status");
    sampleHistory();
    $("controller-pill").innerHTML = `<span class="dot"></span>Online`;
    $("controller-pill").className = "pill green";
    if (state.page === "servers" || state.page === "dashboard" || state.page === "settings") {
      const data = await api("/api/servers");
      state.servers = data.servers || [];
      if (!state.selectedServerId && data.activeServerId) state.selectedServerId = data.activeServerId;
    }
    if (state.page === "servers" || state.page === "backups") state.backups = (await api("/api/backups")).backups || [];
    if (state.page === "mods") {
      try { state.mods = await api("/api/mods?" + q({ serverId: selectedServerIdForApi() })); } catch { state.mods = { installed: [] }; }
    }
    if (state.page === "servers" && state.selectedServerId) {
      try { state.modsByServer[state.selectedServerId] = await api("/api/mods?" + q({ serverId: state.selectedServerId })); } catch { state.modsByServer[state.selectedServerId] = { installed: [] }; }
    }
    if (state.page === "files") await loadFiles(false);
    const installed = state.status?.server?.installed ?? false;
    const running = state.status?.server?.running ?? false;
    if (forceRender || state.renderedPage !== state.page || previousInstalled !== installed || previousRunning !== running) {
      render();
    } else {
      updateLivePage();
    }
  } catch (error) {
    $("controller-pill").innerHTML = `<span class="dot"></span>Offline`;
    $("controller-pill").className = "pill red";
    notice(error.message, true);
  }
}

function render() {
  renderNav();
  state.renderedPage = state.page;
  $("title").textContent = pages.find(([id]) => id === state.page)?.[1] || "MineMux";
  $("subtitle").textContent = subtitle();
  if (state.page === "dashboard") renderDashboard();
  if (state.page === "servers") renderServers();
  if (state.page === "backups") renderBackups();
  if (state.page === "mods") renderMods();
  if (state.page === "files") renderFiles();
  if (state.page === "settings") renderSettings();
  if (state.page === "console") renderConsole();
}

function updateLivePage() {
  if (state.page === "dashboard") updateDashboard();
  if (state.page === "servers") updateServerSummary();
  if (state.page === "backups") updateBackupsListOnly();
  if (state.page === "console") loadLogs("console");
  if (state.page === "files") updateFilesListOnly();
}

function updateServerSummary() {
  const server = selectedServer();
  if (!server) return;
  state.servers.forEach(item => {
    const status = $("server-row-status-" + domId(item.id));
    if (status) status.outerHTML = serverStatusPill(item, "server-row-status-" + domId(item.id));
    setText("server-row-last-" + domId(item.id), item.lastRunAt ? new Date(item.lastRunAt).toLocaleString() : "Never");
  });
  const title = $("server-detail-title");
  if (title) title.textContent = server.name || "MineMux Server";
  const heroStatus = $("server-detail-hero-status");
  if (heroStatus) heroStatus.outerHTML = serverStatusPill(server, "server-detail-hero-status");
  const address = $("server-detail-addresses");
  if (address) address.innerHTML = serverAddressBlock(server);
  const overview = $("server-detail-overview");
  if (overview) overview.innerHTML = serverOverviewGrid(server);
  const actions = $("server-actions-body");
  if (actions) {
    const next = serverActionsBody(server);
    if (actions.innerHTML !== next) {
      actions.innerHTML = next;
      wireServerActionButtons();
    }
  }
  const seed = $("server-seed-panel");
  if (seed) seed.innerHTML = serverSeedPanel(server);
  const backupStats = $("server-backup-stats");
  if (backupStats) backupStats.innerHTML = backupStatsHtml(backupsForServer(server));
  const backupList = $("server-backup-list");
  if (backupList) {
    const next = serverBackupRowsHtml(server);
    if (backupList.innerHTML !== next) {
      backupList.innerHTML = next;
      wireBackupButtons();
    }
  }
  const modSummary = $("server-mod-summary");
  if (modSummary) modSummary.innerHTML = serverModsSummary(server);
  const modList = $("server-mod-list");
  if (modList) {
    const next = serverModsListHtml(server);
    if (modList.innerHTML !== next) {
      modList.innerHTML = next;
      wireModButtons();
    }
  }
  wireCopyButtons();
}

function subtitle() {
  if (state.page === "servers") return "Configured servers and active profile management.";
  if (state.page === "backups") return "Create, upload, restore, and download backups.";
  if (state.page === "mods") return "Install Modrinth projects and uploaded JARs.";
  if (state.page === "files") return "Browse, download, upload, edit, and delete server files.";
  if (state.page === "settings") return "Boot, defaults, and advanced app controls.";
  if (state.page === "console") return "Live server output and command sending.";
  return "Current server, live metrics, quick actions, and setup.";
}

function renderDashboard() {
  const status = state.status || {};
  const server = status.server || {};
  const profile = status.profile || {};
  if (!server.installed) {
    $("content").innerHTML = setupCard();
    wireSetup();
    return;
  }
  const [label, color] = statusLabel(server);
  $("content").innerHTML = `
    <div class="grid">
      <div class="card">
        <div class="between">
          <div class="row grow">
            <div class="runtime">${runtimeLabel(profile.loader)}</div>
            <div class="grow">
              <h2 id="dash-name">${esc(profile.name || "MineMux Server")}</h2>
              <div class="muted">IP: <span id="dash-ip">${esc(server.joinAddress || "-")}</span></div>
              <div id="dash-playit-line">${playitLine(server.playit)}</div>
              <div class="muted" id="dash-version">Minecraft ${esc(profile.minecraftVersion || "-")} ${esc(profile.loader || "-")}</div>
            </div>
          </div>
          <span class="pill ${color}" id="dash-status"><span class="dot"></span>${label}</span>
        </div>
        <div class="actions">
          ${server.running ? `<button class="danger" data-act="stop">Stop</button>` : `<button class="primary" data-act="start">Start</button>`}
          <button data-act="restart">Restart</button>
          <button data-act="backup">Backup</button>
          <button data-act="details">Details</button>
        </div>
      </div>
      <div id="dash-playit-card">${playitCard(server.playit)}</div>
      <div class="metrics">
        ${metric("TPS", server.tps ? server.tps.toFixed(1) + " / 20" : "-", "green", "dash-tps", "tps", 20)}
        ${metric("Players", `${server.players || 0} / ${profile.maxPlayers || 0}`, "green", "dash-players", "players", Math.max(profile.maxPlayers || 1, 1))}
        ${metric("CPU", pct(status.system?.cpu?.percent), "", "dash-cpu", "cpu", 100)}
        ${metric("Memory", pct(status.system?.memory?.percent), "", "dash-memory", "memory", 100)}
        ${metric("Uptime", uptime(server.uptimeSec), "", "dash-uptime")}
        ${metric("Disk", bytes(server.storageBytes), "", "dash-disk", "disk", 100)}
      </div>
      <div class="cols">
        <div class="grid">
          ${activityCard()}
          ${consoleCard()}
        </div>
        ${mapCard(profile)}
      </div>
    </div>`;
  wireDashboardActions();
}

function metric(label, value, color = "", id = "", historyKey = "", max = 100) {
  const graph = historyKey ? `<div class="spark" data-history="${historyKey}" data-max="${max}">${sparkline(state.history[historyKey] || [], max)}</div>` : `<div class="spark empty"></div>`;
  return `<div class="card metric"><h3>${label}</h3><div class="value"${id ? ` id="${id}"` : ""}>${esc(value)}</div>${graph}</div>`;
}

function sampleHistory() {
  const server = state.status?.server || {};
  const profile = state.status?.profile || {};
  pushHistory("tps", Number(server.tps || 0));
  pushHistory("players", Number(server.players || 0));
  pushHistory("cpu", Number(state.status?.system?.cpu?.percent || 0));
  pushHistory("memory", Number(state.status?.system?.memory?.percent || 0));
  const diskLimit = Math.max(Number(server.storageBytes || 0), Number(profile.memoryMb || 1) * 1024 * 1024);
  pushHistory("disk", diskLimit ? Number(server.storageBytes || 0) / diskLimit * 100 : 0);
}

function pushHistory(key, value) {
  if (!Number.isFinite(value)) value = 0;
  state.history[key].push(value);
  if (state.history[key].length > 80) state.history[key].shift();
}

function sparkline(values, max = 100) {
  if (!values || values.length === 0) {
    values = [0];
  }
  const width = 160;
  const height = 34;
  const safeMax = Math.max(1, max, ...values);
  const points = values.map((value, index) => {
    const x = values.length <= 1 ? 0 : index * width / (values.length - 1);
    const y = height - Math.max(0, Math.min(value, safeMax)) / safeMax * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const area = `0,${height} ${points} ${width},${height}`;
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><polygon points="${area}"></polygon><polyline points="${points}"></polyline></svg>`;
}

function updateSparkline(key, max = 100) {
  document.querySelectorAll(`[data-history="${key}"]`).forEach(node => {
    node.innerHTML = sparkline(state.history[key] || [], max);
  });
}

function uptime(seconds) {
  seconds = Number(seconds || 0);
  if (!seconds) return "-";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function playitVisible(playit = {}) {
  return Boolean(playit.claimUrl || playit.address || playit.error);
}

function playitLine(playit = {}) {
  if (!playitVisible(playit)) return "";
  if (playit.address) return `<div class="muted">PlayIt: <span style="color:var(--green);font-weight:800">${esc(playit.address)}</span></div>`;
  if (playit.error) return `<div class="muted">PlayIt: <span style="color:var(--red);font-weight:800">${esc(playit.error)}</span></div>`;
  return `<div class="muted">PlayIt setup: <span style="color:var(--green);font-weight:800">claim link ready</span></div>`;
}

function playitCard(playit = {}) {
  if (!playitVisible(playit)) return "";
  if (playit.address) {
    return `<div class="card"><div class="between"><div><h2>PlayIt.gg</h2><p class="muted">Public tunnel address</p></div><button data-copy="${esc(playit.address)}">Copy</button></div><div class="item"><b>${esc(playit.address)}</b></div></div>`;
  }
  if (playit.error) {
    const claim = playit.claimUrl ? `<a href="${esc(playit.claimUrl)}" target="_blank"><button>Open Claim</button></a>` : "";
    const fallback = playit.running ? `<button data-act="playit-agent-stop">Stop Fallback</button>` : `<button data-act="playit-agent-start">Start Fallback Agent</button>`;
    return `<div class="card"><div class="between"><div><h2>PlayIt.gg</h2><p class="muted">Set the PlayIt agent/tunnel to IPv4 only first. If the plugin still fails, use the fallback agent.</p></div><div class="row">${claim}${fallback}</div></div><div class="item"><b style="color:var(--red)">${esc(playit.error)}</b></div></div>`;
  }
  return `<div class="card"><div class="between"><div><h2>PlayIt.gg Setup</h2><p class="muted">Open this claim link once to finish tunnel setup.</p></div><a href="${esc(playit.claimUrl)}" target="_blank"><button class="primary">Open Claim</button></a></div><div class="item"><b>${esc(playit.claimUrl)}</b></div></div>`;
}

function chunkbaseUrl(seed) {

function chunkbaseHtml(seed) {

function wireDashboardActions() {
  document.querySelectorAll("[data-act]").forEach(button => {
    button.onclick = async () => {
      const act = button.dataset.act;
      try {
        if (act === "start") await run(button, () => post("/api/server/start"));
        if (act === "stop" && confirm("Stop server?")) await run(button, () => post("/api/server/stop"));
        if (act === "restart" && confirm("Restart server?")) await run(button, () => post("/api/server/restart"));
        if (act === "backup") await run(button, () => post("/api/backups/create"));
        if (act === "details") { state.page = "servers"; render(); return; }
        if (act === "console-page") { state.page = "console"; render(); return; }
        if (act === "send-dashboard") await sendCommand($("dash-command").value);
        if (act === "playit-agent-start") await run(button, () => post("/api/playit/agent/start"));
        if (act === "playit-agent-stop") await run(button, () => post("/api/playit/agent/stop"));
        await refresh();
      } catch (error) { notice(error.message, true); }
    };
  });
  wireCopyButtons();
  loadLogs("dash-console");
}

function wireCopyButtons() {
  document.querySelectorAll("[data-copy]").forEach(button => {
    button.onclick = async () => {
      try {
        await navigator.clipboard.writeText(button.dataset.copy || "");
        notice("Copied");
      } catch {
        notice("Copy failed", true);
      }
    };
  });
}

async function run(button, fn) {
  button.disabled = true;
  try { await fn(); notice("Done"); }
  finally { setTimeout(() => button.disabled = false, 1200); }
}

async function wireSetup() {
  try {
    state.options = await api("/api/server/options");
    const version = $("setup-version");
    version.innerHTML = `<option>latest-compatible</option>` + (state.options.minecraftVersions || []).map(v => `<option>${esc(v.id)}</option>`).join("");
  } catch {}
  const loader = $("setup-loader");
  const playit = $("setup-playit");
  const updatePlayitSetup = () => {
    const paper = loader.value === "paper";
    playit.disabled = !paper;
    if (!paper) playit.checked = false;
  };
  loader.onchange = updatePlayitSetup;
  updatePlayitSetup();
  $("setup-create").onclick = async () => {
    const loaderValue = $("setup-loader").value;
    const body = {
      serverId: $("setup-id").value,
      name: $("setup-name").value,
      minecraftVersion: $("setup-version").value,
      loader: loaderValue,
      seed: $("setup-seed").value,
      memoryMb: Number($("setup-memory").value),
      maxPlayers: Number($("setup-players").value),
      viewDistance: Number($("setup-view").value),
      simulationDistance: Number($("setup-sim").value),
      pendingModrinthProjects: [],
      crossplay: { enabled: $("setup-crossplay").checked, installGeyser: $("setup-crossplay").checked, installFloodgate: $("setup-floodgate").checked, floodgate: $("setup-floodgate").checked, bedrockUdp: 19132 },
      playit: { enabled: loaderValue === "paper" && $("setup-playit").checked },
      acceptEula: $("setup-eula").checked
    };
    if (!body.acceptEula) return notice("Accept the Minecraft EULA first.", true);
    await run($("setup-create"), () => post("/api/server/setup", body));
    await refresh();
  };
}

function selectOptions(values, selected) {
  return values.map(value => `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(value)}</option>`).join("");
}

function boolOptions(selected) {
  return `<option value="true" ${selected ? "selected" : ""}>Enabled</option><option value="false" ${!selected ? "selected" : ""}>Disabled</option>`;
}

function propBool(props, key, fallback) {
  if (props[key] === undefined) return fallback;
  return String(props[key]).toLowerCase() === "true";
}

function serverBackupsCard(server) {
  return `<div class="card">
    <div class="section-head">
      <div><h2>Backups</h2><p class="muted" id="server-backup-stats">${backupStatsHtml(backupsForServer(server))}</p></div>
      <button class="primary" data-server-act="backup" data-server-id="${esc(server.id)}">Create</button>
    </div>
    <div class="detail-actions" style="margin-bottom:10px">
      ${server.active ? `<button data-upload-backup>Upload + Restore</button>` : `<button disabled>Upload + Restore</button>`}
    </div>
    <div class="list" id="server-backup-list">${serverBackupRowsHtml(server)}</div>
  </div>`;
}

function backupsForServer(server) {
  const serverId = server?.id || "";
  return (state.backups || []).filter(backup => {
    const metaServer = backup.meta?.serverId;
    if (metaServer) return metaServer === serverId;
    if (server?.active) return true;
    return String(backup.id || "").startsWith(serverId + "-");
  }).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}

function backupStatsHtml(backups) {
  const locked = backups.filter(backup => backup.locked).length;
  const totalSize = backups.reduce((sum, backup) => sum + Number(backup.sizeBytes || 0), 0);
  return `${backups.length} backups / ${locked} locked / ${bytes(totalSize)}`;
}

function serverBackupRowsHtml(server) {
  const backups = backupsForServer(server);
  return backups.map(backup => serverBackupRow(backup, server)).join("") || `<p class="muted">No backups recorded for this server.</p>`;
}

function serverBackupRow(backup, server) {
  return `<div class="item compact-item between">
    <div>
      <b>${backup.locked ? "[locked] " : ""}${esc(backup.id)}</b>
      <div class="muted">${bytes(backup.sizeBytes)} / ${new Date(backup.createdAt).toLocaleString()}</div>
      <div class="dim">${backup.automatic ? "Automatic" : "Manual/uploaded"}${backup.meta?.reason ? ` / ${esc(backup.meta.reason)}` : ""}</div>

    <div class="row">
      <button data-lock-backup="${esc(backup.id)}" data-locked="${backup.locked ? "true" : "false"}">${backup.locked ? "Unlock" : "Lock"}</button>

      ${server.active ? `<button data-restore-backup="${esc(backup.id)}">Restore</button>` : ""}
      <button data-del-backup="${esc(backup.id)}" class="danger">Delete</button>
    </div>
  </div>`;
}

function serverModsCard(server) {

function serverModsSummary(server) {
  const installed = modsForServer(server);

}

function serverModsListHtml(server) {
  const installed = modsForServer(server);
  return installed.slice(0, 8).map(mod => `<div class="item compact-item between"><div><b>${esc(mod.name || mod.fileName)}</b><div class="muted">${esc(mod.targetFolder || "mods")} / ${mod.installedAt ? new Date(mod.installedAt).toLocaleString() : "installed"}</div></div><button data-uninstall="${esc(mod.fileName)}" data-server-id="${esc(server.id)}" class="danger">Remove</button></div>`).join("") || `<p class="muted">No mods or plugins installed.</p>`;
}

function modsForServer(server) {
  if (!server) return [];
  return (state.modsByServer[server.id]?.installed || (server.active ? state.mods?.installed : []) || []);
}

function serverFilesCard(server) {
  return `<div class="card">
    <div class="section-head"><div><h2>Files</h2><p class="muted">Browse, download, upload, and edit files.</p></div></div>
    <button data-open-files data-server-id="${esc(server.id)}" class="primary">Open File Browser</button>
  </div>`;
}

function serverAssetsCard(server) {
  return `<div class="card">
    <div class="section-head"><div><h2>Assets</h2><p class="muted">Server icon and resource pack uploads.</p></div></div>
    <div class="detail-actions">
      <button data-upload-icon>Upload Server Icon</button>
      <button data-upload-pack>Upload Resource Pack</button>
    </div>
  </div>`;
}

function serverSeedPanel(server) {
  const seed = seedForServer(server);
  return `<div class="card">
    <h2>Seed & Map</h2>
    <div class="item compact-item"><b>Seed</b><div class="muted">${esc(seed || "Random / unknown")}</div></div>
    ${seed ? `<p><a class="map-link" target="_blank" href="${chunkbaseUrl(seed)}">Open Chunkbase map</a></p>` : `<p class="muted">Run /seed in the console to let MineMux detect it from logs.</p>`}
  </div>`;
}

function seedForServer(server) {
  const profile = server.profile || {};
  return server.server?.worldSeed || profile.seed || profile.properties?.["level-seed"] || "";
}

function wireServerDetailButtons() {
  document.querySelectorAll("[data-select-card]").forEach(card => {
    card.onclick = event => {
      if (event.target.closest("button,a")) return;
      state.selectedServerId = card.dataset.selectCard;
      render();
    };
  });
  document.querySelectorAll("[data-select-server]").forEach(button => button.onclick = () => { state.selectedServerId = button.dataset.selectServer; render(); });
  document.querySelectorAll("[data-make-active]").forEach(button => button.onclick = async () => {
    await run(button, () => post("/api/servers/switch", { serverId: button.dataset.makeActive }));
    state.selectedServerId = button.dataset.makeActive;
    await refresh(true);
  });
  document.querySelectorAll("[data-delete-server]").forEach(button => button.onclick = async () => {
    if (!confirm("Delete this server and all backups linked to it?")) return;
    await run(button, () => del("/api/servers/" + encodeURIComponent(button.dataset.deleteServer)));
    state.selectedServerId = "";
    await refresh(true);
  });
  document.querySelectorAll("[data-save-properties]").forEach(button => button.onclick = () => saveSelectedServerProperties(button));
  document.querySelectorAll("[data-upload-icon]").forEach(button => button.onclick = () => $("server-icon-upload").click());
  document.querySelectorAll("[data-upload-pack]").forEach(button => button.onclick = () => $("resource-pack-upload").click());
  document.querySelectorAll("[data-upload-backup]").forEach(button => button.onclick = () => $("backup-upload").click());
  document.querySelectorAll("[data-open-files]").forEach(button => button.onclick = async () => { state.selectedServerId = button.dataset.serverId || state.selectedServerId; state.page = "files"; state.filePath = ""; await loadFiles(); });
  document.querySelectorAll("[data-open-mods]").forEach(button => button.onclick = () => { state.page = "mods"; state.renderedPage = ""; render(); });
  document.querySelectorAll("[data-upload-mod]").forEach(button => button.onclick = () => $("mod-upload").click());
  wireServerActionButtons();
  wireBackupButtons();
  wireModButtons();
  wireCopyButtons();
}

function wireServerActionButtons() {
  document.querySelectorAll("[data-server-act]").forEach(button => button.onclick = async () => {
    const action = button.dataset.serverAct;
    try {
      if (action === "start") await run(button, () => post("/api/server/start"));
      if (action === "stop" && confirm("Stop the active server?")) await run(button, () => post("/api/server/stop"));
      if (action === "restart" && confirm("Restart the active server?")) await run(button, () => post("/api/server/restart"));
      if (action === "playit-agent-start") await run(button, () => post("/api/playit/agent/start"));
      if (action === "playit-agent-stop") await run(button, () => post("/api/playit/agent/stop"));
      if (action === "backup") {
        await run(button, () => post("/api/backups/create?" + q({ serverId: button.dataset.serverId || selectedServerIdForApi() })));
        state.backups = (await api("/api/backups")).backups || [];
      }
      if (action === "console") { state.page = "console"; render(); return; }
      await refresh(action === "start" || action === "stop" || action === "restart");
    } catch (error) {
      notice(error.message, true);
    }
  });
}

async function saveSelectedServerProperties(button) {
  const server = selectedServer();
  if (!server) return;
  await run(button, () => post("/api/config?" + q({ serverId: server.id }), {
    memoryMb: Number($("cfg-memory").value),
    maxPlayers: Number($("cfg-players").value),
    viewDistance: Number($("cfg-view").value),
    simulationDistance: Number($("cfg-sim").value),
    motd: $("cfg-motd").value,
    gamemode: $("cfg-gamemode").value,
    difficulty: $("cfg-difficulty").value,
    pvp: $("cfg-pvp").value === "true",
    onlineMode: $("cfg-online").value === "true",
    enableCommandBlock: $("cfg-command-blocks").value === "true",
    whiteList: $("cfg-whitelist").value === "true"
  }));
  await refresh(true);
}

function renderBackups() {
  $("content").innerHTML = `<div class="grid">${backupSettingsCard()}<div class="card"><div class="between"><h2>Backups</h2><div class="row"><button class="primary" id="create-backup">Create</button><button id="upload-backup">Upload + Restore</button></div></div><div class="list" id="backups-list">${backupsListHtml()}</div></div></div>`;
  $("create-backup").onclick = async () => { await run($("create-backup"), () => post("/api/backups/create")); state.backups = (await api("/api/backups")).backups || []; render(); };
  $("upload-backup").onclick = () => $("backup-upload").click();
  wireBackupButtons();
  const save = $("save-backup-policy");
  if (save) save.onclick = async () => {
    await run(save, () => post("/api/config", {
      autoBackupEnabled: $("backup-auto-enabled").value === "true",
      autoBackupIntervalMinutes: Number($("backup-interval").value),
      autoBackupKeep: Number($("backup-keep").value)
    }));
    await refresh();
  };
}

function backupsListHtml() {
  return state.backups.map(backupRow).join("") || `<p class="muted">No backups yet.</p>`;
}

function updateBackupsListOnly() {
  const target = $("backups-list");
  if (!target) return;
  const next = backupsListHtml();
  if (target.innerHTML !== next) {
    target.innerHTML = next;
    wireBackupButtons();
  }
}

function wireBackupButtons() {
  document.querySelectorAll("[data-del-backup]").forEach(button => button.onclick = async () => {
    if (!confirm("Delete this backup?")) return;
    await run(button, () => del("/api/backups/" + encodeURIComponent(button.dataset.delBackup)));
    state.backups = (await api("/api/backups")).backups || [];
    if (state.page === "servers") updateServerSummary();
    if (state.page === "backups") updateBackupsListOnly();
  });
  document.querySelectorAll("[data-lock-backup]").forEach(button => button.onclick = async () => {
    await run(button, () => post("/api/backups/lock?id=" + encodeURIComponent(button.dataset.lockBackup), { locked: button.dataset.locked !== "true" }));
    state.backups = (await api("/api/backups")).backups || [];
    if (state.page === "servers") updateServerSummary();
    if (state.page === "backups") updateBackupsListOnly();
  });
  document.querySelectorAll("[data-restore-backup]").forEach(button => button.onclick = async () => {
    if (!confirm("Restore this backup onto the active server?")) return;
    await run(button, () => post("/api/backups/restore?id=" + encodeURIComponent(button.dataset.restoreBackup)));
    await refresh(true);
  });
}

function backupSettingsCard() {
  const policy = state.status?.profile?.backups || {};
  return `<div class="card"><h2>Backup Settings</h2><p class="muted">Scheduled cleanup only deletes unlocked automatic backups. Manual, uploaded, and locked backups are kept.</p><div class="form">
    <label>Auto backups<select id="backup-auto-enabled"><option value="true" ${policy.autoEnabled ? "selected" : ""}>Enabled</option><option value="false" ${!policy.autoEnabled ? "selected" : ""}>Disabled</option></select></label>
    <label>Every<select id="backup-interval">${backupIntervalOptions(policy.intervalMinutes || 360)}</select></label>
    <label>Keep automatic backups<input id="backup-keep" type="number" min="1" max="100" value="${policy.keepAutoBackups || 5}"></label>
  </div><div class="row" style="margin-top:12px"><button class="primary" id="save-backup-policy">Save Backup Settings</button></div></div>`;
}

function backupIntervalOptions(selected) {
  const options = [[15, "15 minutes"], [30, "30 minutes"], [60, "1 hour"], [180, "3 hours"], [360, "6 hours"], [720, "12 hours"], [1440, "1 day"], [10080, "1 week"]];
  return options.map(([value, label]) => `<option value="${value}" ${Number(selected) === value ? "selected" : ""}>${label}</option>`).join("");
}

function backupRow(b) {
  return `<div class="item between"><div><b>${b.locked ? "[locked] " : ""}${esc(b.id)}</b><div class="muted">${bytes(b.sizeBytes)} / ${new Date(b.createdAt).toLocaleString()}</div><div class="dim">${b.automatic ? "Automatic backup" : "Manual/uploaded backup"}${b.locked ? " / Locked" : ""}</div></div><div class="row"><button data-lock-backup="${esc(b.id)}" data-locked="${b.locked ? "true" : "false"}">${b.locked ? "Unlock" : "Lock"}</button><a href="/api/backups/download?id=${encodeURIComponent(b.id)}"><button>Download</button></a><button data-del-backup="${esc(b.id)}" class="danger">Delete</button></div></div>`;
}

function renderMods() {
  const installed = state.mods?.installed || [];
  $("content").innerHTML = `<div class="cols"><div class="card"><h2>Search Modrinth</h2><div class="row"><input id="mod-query" class="grow" placeholder="spark, chunky, geyser"><button id="mod-search">Search</button><button id="mod-upload-btn">Upload JAR</button></div><div id="mod-results" class="list" style="margin-top:12px"></div></div><div class="card"><h2>Installed</h2><div class="list">${installed.map(m => `<div class="item between"><div>${esc(m.name || m.fileName)}</div><button data-uninstall="${esc(m.fileName)}" class="danger">Remove</button></div>`).join("") || `<p class="muted">No add-ons installed.</p>`}</div></div></div>`;
  $("mod-search").onclick = searchMods;
  $("mod-upload-btn").onclick = () => $("mod-upload").click();
  wireModButtons();
}

function wireModButtons() {
  document.querySelectorAll("[data-uninstall]").forEach(button => button.onclick = async () => {
    const serverId = button.dataset.serverId || selectedServerIdForApi();
    await run(button, () => post("/api/mods/uninstall?" + q({ fileName: button.dataset.uninstall, serverId })));
    try { state.modsByServer[serverId] = await api("/api/mods?" + q({ serverId })); } catch { state.modsByServer[serverId] = { installed: [] }; }
    if (selectedServer()?.active) state.mods = state.modsByServer[serverId];
    if (state.page === "servers") updateServerSummary();
    if (state.page === "mods") renderMods();
  });
}

async function searchMods() {
  const query = $("mod-query").value.trim();
  if (!query) return;
  const serverId = selectedServerIdForApi();
  const res = await api("/api/mods/search?" + q({ query, serverId }));
  $("mod-results").innerHTML = (res.hits || []).slice(0, 10).map(hit => {
    const compatible = hit.compatible !== false;
    const reason = hit.compatibilityReason || (compatible ? "Compatible" : "Not compatible with this server");
    return `<div class="item"><b>${esc(hit.title)}</b><p class="muted">${esc(hit.description)}</p><div class="dim">${esc(reason)}</div><button data-install="${esc(hit.project_id || hit.projectId)}" data-server-id="${esc(serverId)}" ${compatible ? "" : "disabled"}>${compatible ? "Install" : "Incompatible"}</button></div>`;
  }).join("") || `<p class="muted">No Modrinth projects found.</p>`;
  document.querySelectorAll("[data-install]").forEach(b => b.onclick = async () => {
    await run(b, () => post("/api/mods/install?" + q({ serverId: b.dataset.serverId }), { projectId: b.dataset.install }));
    state.modsByServer[b.dataset.serverId] = await api("/api/mods?" + q({ serverId: b.dataset.serverId }));
    state.mods = state.modsByServer[b.dataset.serverId];
    await refresh();
  });
}

async function loadFiles(shouldRender = true) {
  const data = await api("/api/server/files?" + q({ path: state.filePath, serverId: selectedServerIdForApi() }));
  state.files = data.files || [];
  if (shouldRender) render();
}

function renderFiles() {
  $("content").innerHTML = `<div class="cols"><div class="card"><div class="between"><h2>Files /${esc(state.filePath)}</h2><div class="row"><button id="file-up">Up</button><button id="file-upload">Upload</button></div></div><div class="list" id="files-list">${filesListHtml()}</div></div><div id="file-editor-panel">${fileEditorHtml()}</div></div>`;
  $("file-up").onclick = async () => { state.filePath = state.filePath.split("/").slice(0, -1).join("/"); await loadFiles(); };
  $("file-upload").onclick = () => $("server-upload").click();
  wireFileButtons();
  wireFileEditor();
}

function filesListHtml() {
  return state.files.map(fileRow).join("") || `<p class="muted">This folder is empty.</p>`;
}

function updateFilesListOnly() {
  const target = $("files-list");
  if (target) {
    const next = filesListHtml();
    if (target.innerHTML !== next) target.innerHTML = next;
    wireFileButtons();
  }
}

function fileRow(file) {
  return `<div class="item between"><div><b>${file.directory ? "[DIR] " : ""}${esc(file.name)}</b><div class="muted">${file.directory ? "Folder" : bytes(file.sizeBytes)}</div></div><div class="row">${file.directory ? `<button data-open="${esc(file.path)}">Open</button>` : `<button data-edit-file="${esc(file.path)}">Edit</button>`}<a href="/api/server/file?${q({ path: file.path, serverId: selectedServerIdForApi() })}"><button>Download</button></a><button data-delete-file="${esc(file.path)}" class="danger">Delete</button></div></div>`;
}

function wireFileButtons() {
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = async () => { state.filePath = b.dataset.open; state.fileEditor = null; await loadFiles(); });
  document.querySelectorAll("[data-edit-file]").forEach(b => b.onclick = () => openFileEditor(b.dataset.editFile));
  document.querySelectorAll("[data-delete-file]").forEach(b => b.onclick = async () => { if (confirm("Delete file/folder?")) { await del("/api/server/file?" + q({ path: b.dataset.deleteFile, serverId: selectedServerIdForApi() })); if (state.fileEditor?.path === b.dataset.deleteFile) state.fileEditor = null; await loadFiles(); } });
}

async function openFileEditor(path) {
  try {
    const data = await api("/api/server/file?" + q({ path, raw: "1", serverId: selectedServerIdForApi() }));
    state.fileEditor = { path, content: data.content || "" };
    const panel = $("file-editor-panel");
    if (panel) {
      panel.innerHTML = fileEditorHtml();
      wireFileEditor();
    }
  } catch (error) {
    notice(error.message, true);
  }
}

function fileEditorHtml() {
  if (!state.fileEditor) return `<div class="card"><h2>Editor</h2><p class="muted">Select a text file to edit it live.</p></div>`;
  return `<div class="card"><div class="between"><h2>Edit File</h2><button id="close-editor">Close</button></div><p class="muted">${esc(state.fileEditor.path)}</p><textarea id="file-editor-text" spellcheck="false">${esc(state.fileEditor.content)}</textarea><div class="row" style="margin-top:12px"><button class="primary" id="save-editor">Save</button><button id="reload-editor">Reload</button></div></div>`;
}

function wireFileEditor() {
  const close = $("close-editor");
  if (close) close.onclick = () => { state.fileEditor = null; $("file-editor-panel").innerHTML = fileEditorHtml(); };
  const save = $("save-editor");
  if (save) save.onclick = async () => {
    const content = $("file-editor-text").value;
    await run(save, () => api("/api/server/file?" + q({ path: state.fileEditor.path, serverId: selectedServerIdForApi() }), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content }) }));
    state.fileEditor.content = content;
    notice("File saved");
  };
  const reload = $("reload-editor");
  if (reload) reload.onclick = () => openFileEditor(state.fileEditor.path);
}

function renderSettings() {
  const profile = state.status?.profile || {};
  $("content").innerHTML = `<div class="grid"><div class="card"><h2>Preferences</h2><label class="row"><input id="set-autostart" type="checkbox" style="width:auto" ${profile.features?.autoStart ? "checked" : ""}> Start active server on phone boot</label><label class="row"><input id="set-restart" type="checkbox" style="width:auto" ${profile.features?.restartOnCrash !== false ? "checked" : ""}> Auto-restart on crash</label></div><div class="card"><h2>Advanced</h2><div class="row"><button onclick="location.href='/'">Web UI</button><button id="refresh-settings">Refresh</button></div></div></div>`;
  $("set-autostart").onchange = e => post("/api/config", { autoStart: e.target.checked }).then(refresh).catch(err => notice(err.message, true));
  $("set-restart").onchange = e => post("/api/config", { restartOnCrash: e.target.checked }).then(refresh).catch(err => notice(err.message, true));
  $("refresh-settings").onclick = refresh;
}

function renderConsole() {
  $("content").innerHTML = `<div class="card"><h2>Live Console</h2><div class="console" id="console">Loading logs...</div><div class="row" style="margin-top:12px"><input id="console-command" class="grow" placeholder="say Hello"><button id="send-console">Send</button></div></div>`;
  $("send-console").onclick = () => sendCommand($("console-command").value);
  loadLogs("console");
}

async function loadLogs(id) {
  try {
    const data = await api("/api/server/logs");
    state.logs = data.lines || [];
    const target = $(id);
    if (target) target.textContent = state.logs.slice(-80).join("\n") || "No logs yet.";
  } catch {}
}

async function sendCommand(command) {
  command = (command || "").trim();
  if (!command) return;
  await post("/api/server/command", { command });
  notice("Command sent");
  await loadLogs("console");
  await loadLogs("dash-console");
}

async function uploadTo(endpoint, input, onDone) {
  const file = input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  const res = await fetch(endpoint, { method: "POST", body: form });
  if (!res.ok) throw new Error(await res.text());
  input.value = "";
  if (onDone) await onDone();
}

$("backup-upload").onchange = e => uploadTo("/api/backups/upload?restore=true", e.target, refresh).catch(err => notice(err.message, true));
$("server-upload").onchange = e => uploadTo("/api/server/file/upload?" + q({ path: state.filePath, serverId: selectedServerIdForApi() }), e.target, () => loadFiles()).catch(err => notice(err.message, true));
$("mod-upload").onchange = e => uploadTo("/api/mods/upload?" + q({ serverId: selectedServerIdForApi() }), e.target, refresh).catch(err => notice(err.message, true));
$("server-icon-upload").onchange = e => uploadTo("/api/server/icon?" + q({ serverId: state.selectedServerId }), e.target, refresh).catch(err => notice(err.message, true));
$("resource-pack-upload").onchange = e => uploadTo("/api/server/resource-pack?" + q({ serverId: selectedServerIdForApi() }), e.target, refresh).catch(err => notice(err.message, true));
$("refresh").onclick = refresh;

setInterval(() => {
  refresh();
  if (state.page === "console" || state.page === "dashboard") loadLogs(state.page === "console" ? "console" : "dash-console");
}, 3000);
refresh();
</script>
</body>
</html>
