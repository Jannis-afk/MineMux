async function maybeCleanupWorldForMods(button, mods, serverId, actionLabel = "remove") {
  const names = mods.map(mod => mod.currentName || mod.name || mod.fileName).filter(Boolean).join(", ");
  if (!confirm(`Scan the world for blocks and entities from ${names} before ${actionLabel}?`)) return true;
  const defaults = [...new Set(mods.map(inferModNamespace).filter(Boolean))].join(", ");
  const raw = prompt("Mod block namespace(s) to scan, comma separated:", defaults);
  if (raw === null) return false;
  const namespaces = raw.split(",").map(value => value.trim()).filter(Boolean);
  if (!namespaces.length) return confirm(`No namespace entered. Continue ${actionLabel} without world cleanup?`);
  const scan = await run(button, () => post("/api/world/mods/scan?" + q({ serverId }), { namespaces }));
  const total = (scan.totalBlocks || 0) + (scan.totalBlockEntities || 0) + (scan.totalEntities || 0);
  if (!total) {
    notice("No matching world blocks or entities found.");
    return true;
  }
  const summary = modWorldScanSummary(scan);
  if (!confirm(`${summary}\n\nReplace matching blocks with air and remove matching entities before continuing?`)) {
    return confirm(`Continue ${actionLabel} without cleaning these world references?`);
  }
  const cleaned = await run(button, () => post("/api/world/mods/cleanup?" + q({ serverId }), { namespaces }));
  notice(`World cleanup done. Backup: ${cleaned.backupId || "created"}`);
  return true;
}

function inferModNamespace(mod = {}) {
  const projectId = String(mod.projectId || mod.projectID || "");
  const uuidLike = /^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(projectId);
  const raw = uuidLike ? (mod.name || mod.currentName || mod.fileName || "") : (projectId || mod.name || mod.currentName || mod.fileName || "");
  const base = String(raw).replace(/\.jar$/i, "").toLowerCase();
  const first = base.split(/[\s_-]+/).find(Boolean) || base;
  return first.replace(/[^a-z0-9_.-]/g, "");
}

function modWorldScanSummary(scan = {}) {
  const lines = [
    `Found ${scan.totalBlocks || 0} blocks, ${scan.totalBlockEntities || 0} block entities, and ${scan.totalEntities || 0} entities.`,
    `Matched chunks: ${scan.totalChunksMatched || 0} / ${scan.totalChunksScanned || 0}.`
  ];
  (scan.dimensions || []).forEach(dim => {
    if ((dim.blocks || 0) + (dim.blockEntities || 0) + (dim.entities || 0) > 0) {
      lines.push(`${dim.dimension}: ${dim.blocks || 0} blocks, ${dim.blockEntities || 0} block entities, ${dim.entities || 0} entities`);
    }
  });
  return lines.join("\n");
}

async function searchMods() {
  const query = $("mod-query").value.trim();
  if (!query) return;
  const serverId = selectedServerIdForApi();
  const results = $("mod-results");
  results.innerHTML = `<div class="item">Searching ${esc(providerSearchLabel())}...</div>`;
  try {
    const res = await api("/api/mods/search?" + q({ query, provider: state.modProvider, serverId }));
    results.innerHTML = (res.hits || []).slice(0, 24).map(hit => modResultCard(hit, serverId)).join("") || emptyState("No matching projects", "Try a different project name or upload a JAR manually.", `<button data-upload-mod>Upload JAR</button>`);
    document.querySelectorAll("[data-upload-mod]").forEach(button => button.onclick = () => $("mod-upload").click());
    wireModResultButtons();
  } catch (error) {
    results.innerHTML = `<div class="item"><b>Search failed</b><div class="muted">${esc(error.message)}</div></div>`;
  }
}

function providerSearchLabel() {
  if (state.modProvider === "all") return "providers";
  return providerLabel(state.modProvider);
}

function providerLabel(provider) {
  if (provider === "curseforge") return "CurseForge";
  if (provider === "modrinth") return "Modrinth";
  return "All";
}

function displayRuntime(loader) {
  return loader ? loader.charAt(0).toUpperCase() + loader.slice(1) : "Runtime";
}

function modResultCard(hit, serverId) {
  const compatible = hit.compatible !== false;
  const reason = hit.compatibilityReason || (compatible ? "Compatible with this server" : "Not compatible with this server");
  const projectId = hit.project_id || hit.projectId;
  const provider = hit.provider || "modrinth";
  const icon = hit.icon_url ? `<img class="mod-icon" src="${esc(hit.icon_url)}" alt="">` : `<div class="mod-icon runtime">${esc(providerLabel(provider).slice(0, 1))}</div>`;
  const categories = (hit.categories || []).slice(0, 5).map(category => `<span class="pill">${esc(category)}</span>`).join("");
  const versions = (hit.versions || []).slice(0, 5).join(", ");
  const loaders = (hit.supportedLoaders || []).slice(0, 5).join(", ");
  return `<div class="item mod-card" data-mod-card="${esc(provider)}-${esc(projectId)}">
    ${icon}
    <div class="grow">
      <div class="between">
        <div><b>${esc(hit.title)}</b><div class="muted">${esc(hit.author ? "by " + hit.author : providerLabel(provider))} / ${formatDownloads(hit.downloads)} downloads</div></div>
        <span class="pill ${compatible ? "green" : "amber"}"><span class="dot"></span>${compatible ? "Ready" : "Blocked"}</span>
      </div>
      <p class="muted">${esc(hit.description || "")}</p>
      <div class="mod-meta"><span class="pill blue">${esc(providerLabel(provider))}</span>${categories}</div>
      <div class="dim" style="margin-top:8px">${esc(reason)}${versions ? " / MC " + esc(versions) : ""}${loaders ? " / " + esc(loaders) : ""}</div>
      <div class="mod-version-tools">
        <select data-version-select="${esc(projectId)}" data-provider="${esc(provider)}"><option value="">Latest compatible</option></select>
        <button data-load-versions="${esc(projectId)}" data-provider="${esc(provider)}">Versions</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button data-install="${esc(projectId)}" data-provider="${esc(provider)}" data-server-id="${esc(serverId)}" ${compatible ? "" : "disabled"}>${compatible ? "Install" : "Incompatible"}</button>
        ${hit.websiteUrl ? `<a href="${esc(hit.websiteUrl)}" target="_blank"><button>Open Page</button></a>` : ""}
      </div>
    </div>
  </div>`;
}

function formatDownloads(value) {
  value = Number(value || 0);
  if (value >= 1000000) return (value / 1000000).toFixed(1) + "M";
  if (value >= 1000) return (value / 1000).toFixed(1) + "K";
  return String(value);
}

function wireModResultButtons() {
  document.querySelectorAll("[data-load-versions]").forEach(button => button.onclick = () => loadModVersions(button));
  document.querySelectorAll("[data-install]").forEach(button => button.onclick = () => installSelectedMod(button));
}

async function loadModVersions(button) {
  const select = modVersionSelect(button.dataset.loadVersions, button.dataset.provider);
  if (!select) return;
  button.disabled = true;
  try {
    const data = await api("/api/mods/versions?" + q({ provider: button.dataset.provider, projectId: button.dataset.loadVersions, serverId: selectedServerIdForApi() }));
    const versions = data.versions || [];
    select.innerHTML = `<option value="">Latest compatible</option>` + versions.map(version => {
      const label = `${version.versionNumber || version.name || version.id} / ${version.releaseType || "release"}${version.fileName ? " / " + version.fileName : ""}`;
      return `<option value="${esc(version.id)}">${esc(label)}</option>`;
    }).join("");
    notice(`${versions.length} versions loaded`);
  } catch (error) {
    notice(error.message, true);
  } finally {
    button.disabled = false;
  }
}

async function installSelectedMod(button) {
  const serverId = button.dataset.serverId;
  const provider = button.dataset.provider || "modrinth";
  const projectId = button.dataset.install;
  const select = modVersionSelect(projectId, provider);
  const versionId = select?.value || "";
  try {
    await run(button, () => post("/api/mods/install?" + q({ serverId }), { provider, projectId, versionId }));
    state.modsByServer[serverId] = await api("/api/mods?" + q({ serverId }));
    state.mods = state.modsByServer[serverId];
    await refresh(true);
  } catch (error) {
    notice(error.message, true);
  }
}

function modVersionSelect(projectId, provider) {
  return Array.from(document.querySelectorAll("[data-version-select]")).find(select => select.dataset.versionSelect === projectId && select.dataset.provider === provider);
}

function renderUpdates() {
  const server = selectedServer();
  const plan = state.updates;
  if (!server) {
    $("content").innerHTML = `<div class="card">${emptyState("No server selected", "Create or select a server before checking updates.", `<button class="primary" data-open-setup>Create Server</button>`)}</div>`;
    document.querySelectorAll("[data-open-setup]").forEach(button => button.onclick = () => goPage("setup"));
    return;
  }
  if (!plan) {
    $("content").innerHTML = `<div class="card"><h2>Updates</h2><p class="muted">Checking ${esc(server.name || server.id)}...</p></div>`;
    loadUpdatePlan(true);
    return;
  }
  if (plan.error) {
    $("content").innerHTML = `<div class="card"><div class="section-head"><div><h2>Updates</h2><p class="muted">${esc(plan.error)}</p></div><button id="check-updates">Retry</button></div></div>`;
    $("check-updates").onclick = () => loadUpdatePlan(true);
    return;
  }
  const mc = plan.minecraft || {};
  const mods = plan.mods || [];
  const available = mods.filter(mod => mod.updateAvailable).length;
  const blockers = (plan.blockers || []).length;
  const runtimeChecked = mc.runtimeRefreshAvailable ? "checked" : "";
  const runtimeWork = Boolean(mc.runtimeRefreshAvailable || mc.updateAvailable);
  const modWork = mods.some(mod => mod.updateAvailable || mod.status === "available");
  const choicesNeeded = blockers > 0;
  const allCurrent = !runtimeWork && !modWork && !choicesNeeded;
  const stopNote = plan.requiresStop ? `<div class="inline-note">Stop this server before applying updates.</div>` : "";
  const readyNote = allCurrent ? `<div class="inline-note">Everything tracked is current for this server.</div>` : "";
  $("content").innerHTML = `<div class="grid">
    <div class="card">
      <div class="section-head">
        <div>
          <h2>${esc(server.name || server.id)}</h2>
          <p class="muted">Minecraft ${esc(mc.currentVersion || "-")} / ${esc(mc.loader || "-")}</p>
        </div>
        <div class="row">
          <button id="check-updates">Check</button>
          ${plan.requiresStop ? `<button class="danger" id="stop-for-updates">Stop Server</button>` : ""}
          <button class="primary" id="apply-updates" ${(plan.requiresStop || allCurrent) ? "disabled" : ""}>Apply Updates</button>
        </div>
      </div>
      ${stopNote}
      ${readyNote}
      <div class="server-kv-grid" style="margin-top:12px">
        <div class="mini-card"><span class="muted">Minecraft</span><b>${esc(mc.currentVersion || "-")} -> ${esc(mc.targetVersion || "-")}</b></div>
        <div class="mini-card"><span class="muted">Runtime</span><b>${mc.runtimeRefreshAvailable ? "Refresh ready" : "No target"}</b></div>
        <div class="mini-card"><span class="muted">Add-ons</span><b>${available} updates</b></div>
        <div class="mini-card"><span class="muted">Choices</span><b>${blockers}</b></div>
      </div>
    </div>
    <div class="cols">
      <div class="grid">
        <div class="card">
          <div class="section-head">
            <div><h2>Minecraft + Runtime</h2><p class="muted">${esc(mc.message || "Runtime/build refresh available.")}</p></div>
            <span class="pill ${mc.updateAvailable ? "green" : ""}"><span class="dot"></span>${mc.updateAvailable ? "Version update" : "Runtime refresh"}</span>
          </div>
          <label style="display:flex;align-items:center;gap:10px;margin-top:12px"><input id="update-runtime" type="checkbox" style="width:auto" ${runtimeChecked}>Update runtime for Minecraft ${esc(mc.targetVersion || mc.currentVersion || "-")}</label>
          ${mc.warning ? `<p class="hint">${esc(mc.warning)}</p>` : ""}
        </div>
      </div>
      <div class="grid">
        <div class="card">
          <div class="section-head"><div><h2>Managed Add-ons</h2><p class="muted">${mods.length} tracked</p></div></div>
          <div class="list">${mods.map(updateModRow).join("") || emptyState("No tracked add-ons", "Install from Modrinth to let MineMux manage add-on updates.", `<button data-open-mods>Add Add-ons</button>`)}</div>
        </div>
      </div>
    </div>
  </div>`;
  $("check-updates").onclick = () => loadUpdatePlan(true);
  $("apply-updates").onclick = () => applyUpdates($("apply-updates"));
  const stop = $("stop-for-updates");
  if (stop) stop.onclick = async () => { await run(stop, () => post("/api/server/stop")); await refresh(true); };
  const runtime = $("update-runtime");
  if (runtime) runtime.onchange = syncUpdateApplyButton;
  document.querySelectorAll("[data-mod-choice]").forEach(select => select.onchange = syncUpdateApplyButton);
  document.querySelectorAll("[data-open-mods]").forEach(button => button.onclick = () => goPage("mods", true));
  syncUpdateApplyButton();
}

function syncUpdateApplyButton() {
  const button = $("apply-updates");
  if (!button || !state.updates || state.updates.requiresStop) return;
  const runtimeSelected = $("update-runtime")?.checked || false;
  const modSelected = Array.from(document.querySelectorAll("[data-mod-choice]")).some(select => select.value !== "ignore");
  button.disabled = !(runtimeSelected || modSelected);
}

function updateModRow(mod) {
  const label = mod.currentName || mod.fileName;
  const detail = mod.status === "available"
    ? `${mod.targetName || mod.targetFileName || "Latest compatible version"}`
    : (mod.reason || (mod.status === "current" ? "Current compatible version is installed." : "Needs a choice."));
  const pill = mod.status === "available" ? "green" : (mod.status === "current" ? "" : "amber");
  return `<div class="item compact-item between">
    <div class="grow">
      <b>${esc(label)}</b>
      <div class="muted">${esc(mod.targetFolder || "mods")} / ${esc(detail)}</div>
    </div>
    <div class="row">
      <span class="pill ${pill}"><span class="dot"></span>${esc(updateStatusLabel(mod.status))}</span>
      ${updateChoiceSelect(mod)}
    </div>
  </div>`;
}

function updateStatusLabel(status) {
  if (status === "available") return "Update";
  if (status === "unavailable") return "Blocked";
  if (status === "manual") return "Manual";
  return "Current";
}

function updateChoiceSelect(mod) {
  const key = updateChoiceKey(mod);
  if (!key) return "";
  if (mod.status === "available") {
    return `<select style="width:auto;min-width:130px" data-mod-choice="${esc(key)}"><option value="update">Update</option><option value="ignore">Ignore</option><option value="disable">Disable</option></select>`;
  }
  if (mod.status === "unavailable" || mod.status === "manual") {
    return `<select style="width:auto;min-width:150px" data-mod-choice="${esc(key)}"><option value="ignore">Ignore</option><option value="disable">Disable</option><option value="manual">Upload manually</option></select>`;
  }
  return "";
}

function updateChoiceKey(mod) {
  return mod.projectId || mod.fileName || "";
}

async function loadUpdatePlan(renderAfter = true) {
  try {
    state.updates = await api("/api/updates?" + q({ serverId: selectedServerIdForApi() }));
  } catch (error) {
    state.updates = { error: error.message, mods: [], blockers: [] };
  }
  if (renderAfter && state.page === "updates") renderUpdates();
}

async function applyUpdates(button) {
  const plan = state.updates;
  if (!plan || plan.error) return;
  const choices = {};
  let manualSelected = false;
  document.querySelectorAll("[data-mod-choice]").forEach(select => {
    choices[select.dataset.modChoice] = select.value;
    if (select.value === "manual") manualSelected = true;
  });
  const disabledMods = (plan.mods || []).filter(mod => choices[updateChoiceKey(mod)] === "disable" || choices[mod.fileName] === "disable");
  if (disabledMods.length) {
    const proceed = await maybeCleanupWorldForMods(button, disabledMods, selectedServerIdForApi(), "disabling during update");
    if (!proceed) return;
  }
  try {
    const result = await run(button, () => post("/api/updates/apply?" + q({ serverId: selectedServerIdForApi() }), {
      updateMinecraft: $("update-runtime")?.checked || false,
      targetMinecraftVersion: plan.minecraft?.targetVersion || "",
      updateMods: (plan.mods || []).length > 0,
      modChoices: choices
    }));
    state.updates = result.plan || null;
    if (manualSelected) $("mod-upload").click();
    await refresh(true);
  } catch (error) {
    notice(error.message, true);
  }
}

function renderWorld() {
  const data = state.world.data;
  const trimDisabled = !state.world.trimAreas.length || !data?.chunks?.length;
  $("content").innerHTML = `<div class="grid">
    <div class="card">
      <div class="world-toolbar">
        <div class="row">
          <select id="world-dimension">${worldDimensionOptions(data)}</select>
          <button id="world-reload">Reload</button>
          <button id="world-reset">Reset View</button>
          <button id="world-origin">Jump 0,0</button>
        </div>
        <label class="world-limit">
          <span>Chunks</span>
          <input id="world-limit-slider" type="range" min="0" max="${WORLD_LIMIT_STEPS.length - 1}" step="1" value="${closestWorldLimitIndex(state.world.limit)}">
          <b id="world-limit-readout">${formatDownloads(state.world.limit)} chunks</b>
        </label>
        <div class="world-zoom-tools">
          <button id="world-zoom-out">-</button>
          <span class="pill"><span class="dot"></span><span id="world-zoom-label">${worldZoomLabel()}</span></span>
          <button id="world-zoom-in">+</button>
        </div>
        <div class="row">
          <button id="world-trim-mode" class="${state.world.trimMode ? "primary" : ""}">${state.world.trimMode ? "Drawing Keep Areas" : "Draw Keep Area"}</button>
          <button id="world-trim-undo" ${state.world.trimAreas.length ? "" : "disabled"}>Undo Area</button>
          <button id="world-trim-clear" ${state.world.trimAreas.length ? "" : "disabled"}>Clear</button>
          <button id="world-trim-apply" class="danger" ${trimDisabled ? "disabled" : ""}>Trim Outside</button>
        </div>
      </div>
      <div class="world-canvas-wrap">
        <canvas id="world-canvas" class="world-canvas ${state.world.trimMode ? "trimming" : ""}"></canvas>
        <div class="world-coordinates" id="world-coordinates">${worldCoordinateHtml()}</div>
        <div class="world-legend" id="world-legend">${worldLegendHtml(data)}</div>
      </div>
      <div class="world-trim-panel" id="world-trim-panel">${worldTrimPanelHtml(data)}</div>
      <div class="world-trim-panel" id="world-player-panel">${worldPlayerPanelHtml()}</div>
    </div>
  </div>`;
  wireWorldControls();
  if (!data || data.dimension !== state.world.dimension) {
    loadWorldMap(true);
  } else {
    drawWorldMap();
  }
}

function worldDimensionOptions(data) {
  const dimensions = data?.availableDimensions || [
    { id: "overworld", name: "Overworld", available: true },
    { id: "nether", name: "Nether", available: true },
    { id: "end", name: "End", available: true }
  ];
  return dimensions.map(dim => `<option value="${esc(dim.id)}" ${dim.id === state.world.dimension ? "selected" : ""} ${dim.available ? "" : "disabled"}>${esc(dim.name)}${dim.available ? ` (${dim.regionFiles || 0})` : " (not generated)"}</option>`).join("");
}

function worldLegendHtml(data) {
  if (!data) return `<b>Loading world...</b><div class="muted">Reading generated region files from the active server.</div>`;
  if (data.warning && !data.chunks?.length) return `<b>${esc(data.warning)}</b>`;
  if (!data.chunks?.length) return `<b>No generated chunks found.</b><div class="muted">Start and explore this dimension first.</div>`;
  const trim = state.world.trimAreas.length ? `<div class="muted">${state.world.trimAreas.length} keep area${state.world.trimAreas.length === 1 ? "" : "s"} selected</div>` : "";
  const total = Number(data.totalChunks || data.chunks.length);
  const mode = "full-resolution lazy detail";
  const shown = total > data.chunks.length ? `${formatDownloads(data.chunks.length)} of ${formatDownloads(total)}` : formatDownloads(data.chunks.length);
  const warning = data.warning ? `<div class="hint">${esc(data.warning)}</div>` : "";
  return `<b>${shown} chunks</b><div class="muted">${esc(data.worldName || "world")} / ${esc(data.dimension)} / ${mode}</div>${warning}${trim}`;
}

function worldTrimPanelHtml(data) {
  const areas = state.world.trimAreas;
  const generated = worldSelectedGeneratedCount(data);
  const areaText = areas.length ? `${areas.length} keep area${areas.length === 1 ? "" : "s"} / ${generated} visible generated chunks inside` : "No keep areas selected";
  const warning = data?.truncated ? `<div class="hint">The map is limited. Trim still applies to every generated region file in this dimension, including chunks outside the preview.</div>` : `<div class="hint">Trimming keeps selected chunks in this dimension and deletes generated chunks outside them. MineMux creates a restore point first.</div>`;
  const list = areas.map((area, index) => `<div class="item compact-item between"><div><b>Area ${index + 1}</b><div class="muted">${trimAreaLabel(area)}</div></div><button data-remove-trim-area="${index}">Remove</button></div>`).join("");
  return `<div class="world-trim-row"><div><b>World Trim</b><div class="muted">${esc(areaText)}</div></div><span class="pill ${state.world.trimMode ? "green" : "amber"}"><span class="dot"></span>${state.world.trimMode ? "Draw mode" : "Pan mode"}</span></div>${warning}${list ? `<div class="list">${list}</div>` : ""}`;
}

function worldZoomLabel() {
  const chunkPixels = 16 * Number(state.world.scale || 1);
  if (chunkPixels >= 10) return `${chunkPixels.toFixed(0)} px/chunk`;
  if (chunkPixels >= 1) return `${chunkPixels.toFixed(1)} px/chunk`;
  return `${chunkPixels.toFixed(2)} px/chunk`;
}

function worldCoordinateHtml() {
  const point = state.world.pointer;
  if (!point) return `<div>Move over the map</div><div class="muted">X/Z and chunk coordinates show here.</div>`;
  return `<div>X ${Math.floor(point.blockX)}, Y -, Z ${Math.floor(point.blockZ)}</div><div class="muted">Chunk ${point.chunkX}, ${point.chunkZ} / ${esc(state.world.dimension)}</div>`;
}

function worldPlayerPanelHtml() {
  const players = state.world.players || [];
  const rows = players.map(player => {
    const available = player.available !== false && Number.isFinite(Number(player.x)) && Number.isFinite(Number(player.z));
    const dim = normalizeWorldDimension(player.dimension || "");
    const location = available
      ? `X ${Math.floor(player.x)}, Y ${Math.floor(player.y || 0)}, Z ${Math.floor(player.z)} / ${dim || "unknown"}`
      : (player.error || "Position unavailable");
    return `<div class="item compact-item between">
      <div><b>${esc(player.name || "Player")}</b><div class="muted">${esc(location)}</div></div>
      <button data-world-player-jump="${esc(player.name || "")}" ${available ? "" : "disabled"}>Jump To</button>
    </div>`;
  }).join("");
  const status = state.world.playersLoading ? "Refreshing player positions..." : (players.length ? `${players.length} online player${players.length === 1 ? "" : "s"}` : "No online players");
  return `<div class="world-trim-row"><div><b>Players</b><div class="muted">${esc(status)}</div></div><button id="world-players-refresh">Refresh Players</button></div>${rows ? `<div class="list">${rows}</div>` : ""}`;
}

function resetWorldRenderCaches() {
  state.world.bitmap = null;
  state.world.detailCache = new Map();
  state.world.detailRequestKey = "";
  window.clearTimeout(state.world.detailTimer);
  state.world.detailTimer = null;
  state.world.detailInflightTiles = new Set();
  state.world.detailLoadedTiles = new Set();
  state.world.detailFailedTiles = new Map();
  state.world.detailToken++;
}

function wireWorldControls() {
  $("world-dimension").onchange = event => {
    state.world.dimension = event.target.value;
    state.world.data = null;
    resetWorldRenderCaches();
    state.world.centered = false;
    state.world.trimAreas = [];
    state.world.trimDraft = null;
    state.world.trimAnchor = null;
    state.world.players = [];
    loadWorldMap(true);
    loadWorldPlayers();
  };
  const limitSlider = $("world-limit-slider");
  limitSlider.oninput = () => {
    state.world.limit = worldLimitValue();
    updateWorldLimitReadout();
  };
  limitSlider.onchange = () => {
    state.world.limit = worldLimitValue();
    state.world.data = null;
    resetWorldRenderCaches();
    state.world.centered = false;
    loadWorldMap(true);
  };
  $("world-reload").onclick = () => loadWorldMap(false);
  $("world-reset").onclick = () => {
    state.world.centered = false;
    drawWorldMap();
  };
  $("world-origin").onclick = () => centerWorldOnBlock(0, 0, Math.max(state.world.scale, 1.8));
  $("world-zoom-in").onclick = () => zoomWorldAtCanvasCenter(1.65);
  $("world-zoom-out").onclick = () => zoomWorldAtCanvasCenter(1 / 1.65);
  $("world-trim-mode").onclick = () => {
    state.world.trimMode = !state.world.trimMode;
    state.world.trimDraft = null;
    state.world.trimAnchor = null;
    renderWorld();
  };
  $("world-trim-undo").onclick = () => {
    state.world.trimAreas.pop();
    renderWorld();
  };
  $("world-trim-clear").onclick = () => {
    state.world.trimAreas = [];
    state.world.trimDraft = null;
    state.world.trimAnchor = null;
    renderWorld();
  };
  $("world-trim-apply").onclick = () => applyWorldTrim($("world-trim-apply"));
  document.querySelectorAll("[data-remove-trim-area]").forEach(button => button.onclick = () => {
    state.world.trimAreas.splice(Number(button.dataset.removeTrimArea), 1);
    renderWorld();
  });
  $("world-players-refresh").onclick = () => loadWorldPlayers(true);
  document.querySelectorAll("[data-world-player-jump]").forEach(button => {
    button.onclick = () => jumpToWorldPlayer(button.dataset.worldPlayerJump);
  });
  const canvas = $("world-canvas");
  let lastX = 0;
  let lastY = 0;
  canvas.onpointerdown = event => {
    if (state.world.trimMode) {
      const point = worldPointerChunk(canvas, event);
      state.world.drawingTrim = true;
      state.world.trimAnchor = point;
      state.world.trimDraft = normalizeTrimArea(point, point);
      canvas.setPointerCapture?.(event.pointerId);
      drawWorldMap();
      return;
    }
    state.world.dragging = true;
    canvas.classList.add("dragging");
    canvas.setPointerCapture?.(event.pointerId);
    lastX = event.clientX;
    lastY = event.clientY;
  };
  const endDrag = event => {
    if (state.world.drawingTrim) {
      const point = worldPointerChunk(canvas, event);
      state.world.trimDraft = normalizeTrimArea(state.world.trimAnchor, point);
      state.world.trimAreas.push(state.world.trimDraft);
      state.world.trimDraft = null;
      state.world.trimAnchor = null;
      state.world.drawingTrim = false;
      if (event?.pointerId !== undefined) canvas.releasePointerCapture?.(event.pointerId);
      renderWorld();
      return;
    }
    state.world.dragging = false;
    canvas.classList.remove("dragging");
    if (event?.pointerId !== undefined) canvas.releasePointerCapture?.(event.pointerId);
  };
  canvas.onpointerup = endDrag;
  canvas.onpointercancel = endDrag;
  canvas.onpointerleave = endDrag;
  canvas.onpointermove = event => {
    updateWorldPointer(canvas, event);
    if (state.world.drawingTrim) {
      const point = worldPointerChunk(canvas, event);
      state.world.trimDraft = normalizeTrimArea(state.world.trimAnchor, point);
      drawWorldMap();
      return;
    }
    if (!state.world.dragging) return;
    state.world.offsetX += event.clientX - lastX;
    state.world.offsetY += event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    drawWorldMap();
  };
  canvas.onpointerenter = event => updateWorldPointer(canvas, event);
  canvas.onpointerleave = event => {
    if (!state.world.dragging && !state.world.drawingTrim) {
      state.world.pointer = null;
      updateWorldCoordinates();
    }
    endDrag(event);
  };
  canvas.onwheel = event => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    zoomWorldAtPoint(event.deltaY < 0 ? 1.22 : 1 / 1.22, event.clientX - rect.left, event.clientY - rect.top);
  };
  loadWorldPlayers();
}

function worldPointerChunk(canvas, event) {
  const rect = canvas.getBoundingClientRect();
  const blockX = (event.clientX - rect.left - state.world.offsetX) / state.world.scale;
  const blockZ = (event.clientY - rect.top - state.world.offsetY) / state.world.scale;
  return { x: Math.floor(blockX / 16), z: Math.floor(blockZ / 16) };
}

function normalizeTrimArea(start, point) {
  const sx = start?.x ?? start?.minChunkX ?? point.x;
  const sz = start?.z ?? start?.minChunkZ ?? point.z;
  return {
    minChunkX: Math.min(sx, point.x),
    maxChunkX: Math.max(sx, point.x),
    minChunkZ: Math.min(sz, point.z),
    maxChunkZ: Math.max(sz, point.z)
  };
}

function worldScreenToBlock(canvas, clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    blockX: (clientX - rect.left - state.world.offsetX) / state.world.scale,
    blockZ: (clientY - rect.top - state.world.offsetY) / state.world.scale
  };
}

function updateWorldPointer(canvas, event) {
  const point = worldScreenToBlock(canvas, event.clientX, event.clientY);
  state.world.pointer = {
    blockX: point.blockX,
    blockZ: point.blockZ,
    chunkX: Math.floor(point.blockX / 16),
    chunkZ: Math.floor(point.blockZ / 16)
  };
  updateWorldCoordinates();
}

function updateWorldCoordinates() {
  const node = $("world-coordinates");
  if (node) node.innerHTML = worldCoordinateHtml();
}

function normalizeWorldScale(value) {
  return Math.max(WORLD_MIN_SCALE, Math.min(WORLD_MAX_SCALE, Number(value) || 1));
}

function zoomWorldAtCanvasCenter(factor) {
  const canvas = $("world-canvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  zoomWorldAtPoint(factor, rect.width / 2, rect.height / 2);
}

function zoomWorldAtPoint(factor, screenX, screenY) {
  const oldScale = state.world.scale;
  const nextScale = normalizeWorldScale(oldScale * factor);
  if (Math.abs(nextScale - oldScale) < 0.00001) return;
  state.world.offsetX = screenX - (screenX - state.world.offsetX) * (nextScale / oldScale);
  state.world.offsetY = screenY - (screenY - state.world.offsetY) * (nextScale / oldScale);
  state.world.scale = nextScale;
  state.world.centered = true;
  drawWorldMap();
}

function centerWorldOnBlock(blockX, blockZ, scale) {
  const canvas = $("world-canvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  if (scale) state.world.scale = normalizeWorldScale(scale);
  state.world.offsetX = rect.width / 2 - Number(blockX || 0) * state.world.scale;
  state.world.offsetY = rect.height / 2 - Number(blockZ || 0) * state.world.scale;
  state.world.centered = true;
  drawWorldMap();
}

function fitWorldToView(width, height, data) {
  if (!data?.chunks?.length) return;
  const minBlockX = data.bounds.minX * 16;
  const maxBlockX = (data.bounds.maxX + 1) * 16;
  const minBlockZ = data.bounds.minZ * 16;
  const maxBlockZ = (data.bounds.maxZ + 1) * 16;
  const spanX = Math.max(16, maxBlockX - minBlockX);
  const spanZ = Math.max(16, maxBlockZ - minBlockZ);
  const fitScale = normalizeWorldScale(Math.min((width * 0.86) / spanX, (height * 0.86) / spanZ));
  state.world.scale = fitScale;
  state.world.offsetX = (width - spanX * fitScale) / 2 - minBlockX * fitScale;
  state.world.offsetY = (height - spanZ * fitScale) / 2 - minBlockZ * fitScale;
  state.world.centered = true;
}

async function loadWorldMap(resetView) {
  const canvas = $("world-canvas");
  const legend = $("world-legend");
  const token = ++state.world.loadToken;
  const requestServerId = selectedServerIdForApi();
  const requestDimension = state.world.dimension;
  const requestLimit = state.world.limit;
  if (legend) legend.innerHTML = `<b>Loading world...</b><div class="muted">Scanning region files.</div>`;
  resetWorldRenderCaches();
  if (canvas) {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  try {
    const data = await api("/api/world/map?" + q({ serverId: requestServerId, dimension: requestDimension, limit: requestLimit }));
    if (token !== state.world.loadToken || requestServerId !== selectedServerIdForApi() || requestDimension !== state.world.dimension || requestLimit !== state.world.limit) return;
    state.world.data = data;
    state.world.dimension = state.world.data.dimension || state.world.dimension;
    if (resetView) state.world.centered = false;
    const select = $("world-dimension");
    if (select) select.innerHTML = worldDimensionOptions(state.world.data);
    if (legend) legend.innerHTML = worldLegendHtml(state.world.data);
    drawWorldMap();
    if (state.world.pendingJump && normalizeWorldDimension(state.world.pendingJump.dimension) === state.world.dimension) {
      const jump = state.world.pendingJump;
      state.world.pendingJump = null;
      centerWorldOnBlock(jump.x, jump.z, jump.scale);
    }
    loadWorldPlayers();
    return data;
  } catch (error) {
    if (token !== state.world.loadToken) return;
    if (legend) legend.innerHTML = `<b>World map failed</b><div class="muted">${esc(error.message)}</div>`;
    notice(error.message, true);
  }
}

function drawWorldMap() {
  const canvas = $("world-canvas");
  if (!canvas) return;
  const data = state.world.data;
  const rect = canvas.getBoundingClientRect();
  const width = Math.max(1, Math.floor(rect.width));
  const height = Math.max(1, Math.floor(rect.height));
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#050608";
  ctx.fillRect(0, 0, width, height);
  $("world-zoom-label").textContent = worldZoomLabel();
  updateWorldCoordinates();
  const legend = $("world-legend");
  if (legend) legend.innerHTML = worldLegendHtml(data);
  if (!data || !data.chunks || !data.chunks.length) {
    ctx.fillStyle = "#b8b4aa";
    ctx.font = "14px system-ui";
    ctx.fillText("No generated chunks to draw.", 18, 28);
    return;
  }
  let scale = state.world.scale;
  const minBlockX = data.bounds.minX * 16;
  const maxBlockX = (data.bounds.maxX + 1) * 16;
  const minBlockZ = data.bounds.minZ * 16;
  const maxBlockZ = (data.bounds.maxZ + 1) * 16;
  if (!state.world.centered) {
    fitWorldToView(width, height, data);
    scale = state.world.scale;
  }
  if (isWorldOverview(data)) {
    drawVisibleWorldDetails(ctx, width, height, data);
    drawWorldDetailStatus(ctx, width, height);
    drawWorldPlayers(ctx);
    drawWorldTrimOverlay(ctx);
    drawWorldCoordinates(ctx, minBlockX, maxBlockX, minBlockZ, maxBlockZ);
    queueVisibleWorldDetails(width, height);
    return;
  }
  for (const chunk of data.chunks) {
    const baseX = chunk.x * 16 * scale + state.world.offsetX;
    const baseY = chunk.z * 16 * scale + state.world.offsetY;
    if (baseX > width || baseY > height || baseX + 16 * scale < 0 || baseY + 16 * scale < 0) continue;
    if (chunk.pixels?.length) {
      drawWorldChunkPixels(ctx, chunk);
    } else {
      ctx.fillStyle = chunk.color || chunk.pixels?.[136] || chunk.pixels?.[0] || "#4f8a3d";
      ctx.fillRect(Math.floor(baseX), Math.floor(baseY), Math.max(1, Math.ceil(16 * scale)), Math.max(1, Math.ceil(16 * scale)));
    }
    if (scale >= 4) {
      ctx.strokeStyle = "rgba(0,0,0,.22)";
      ctx.strokeRect(Math.floor(baseX), Math.floor(baseY), 16 * scale, 16 * scale);
    }
  }
  drawVisibleWorldDetails(ctx, width, height, data);
  drawWorldDetailStatus(ctx, width, height);
  drawWorldPlayers(ctx);
  drawWorldTrimOverlay(ctx);
  drawWorldCoordinates(ctx, minBlockX, maxBlockX, minBlockZ, maxBlockZ);
  queueVisibleWorldDetails(width, height);
}

function isWorldOverview(data) {
  return data?.mode === "overview" || data?.chunks?.some(chunk => !chunk.pixels?.length);
}

function drawWorldOverview(ctx, width, height, data, scale) {
  const bitmap = ensureWorldOverviewBitmap(data);
  if (!bitmap) return;
  if (bitmap.canvas) {
    ctx.imageSmoothingEnabled = false;
    const destX = data.bounds.minX * 16 * scale + state.world.offsetX;
    const destY = data.bounds.minZ * 16 * scale + state.world.offsetY;
    const destW = bitmap.width * 16 * scale;
    const destH = bitmap.height * 16 * scale;
    ctx.drawImage(bitmap.canvas, 0, 0, bitmap.width, bitmap.height, destX, destY, destW, destH);
    return;
  }
  const chunks = bitmap.index ? visibleWorldOverviewChunks(bitmap, width, height, scale) : data.chunks;
  for (const chunk of chunks) {
    const baseX = chunk.x * 16 * scale + state.world.offsetX;
    const baseY = chunk.z * 16 * scale + state.world.offsetY;
    if (baseX > width || baseY > height || baseX + 16 * scale < 0 || baseY + 16 * scale < 0) continue;
    ctx.fillStyle = chunk.color || "#4f8a3d";
    ctx.fillRect(Math.floor(baseX), Math.floor(baseY), Math.ceil(16 * scale), Math.ceil(16 * scale));
  }
}

function worldChunkKey(x, z) {
  return `${x}:${z}`;
}

function worldChunkBitmap(chunk) {
  if (!chunk?.pixels?.length) return null;
  if (chunk._bitmap) return chunk._bitmap;
  const canvas = document.createElement("canvas");
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(16, 16);
  for (let i = 0; i < 256; i++) {
    const color = hexToRgb(chunk.pixels[i] || chunk.color || "#4f8a3d");
    image.data[i * 4] = color.r;
    image.data[i * 4 + 1] = color.g;
    image.data[i * 4 + 2] = color.b;
    image.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
  chunk._bitmap = canvas;
  return canvas;
}

function drawWorldChunkPixels(ctx, chunk) {
  if (!chunk?.pixels?.length) return false;
  const scale = state.world.scale;
  const baseX = chunk.x * 16 * scale + state.world.offsetX;
  const baseY = chunk.z * 16 * scale + state.world.offsetY;
  if (scale < 1) {
    const bitmap = worldChunkBitmap(chunk);
    if (!bitmap) return false;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bitmap, baseX, baseY, 16 * scale, 16 * scale);
    return true;
  }
  for (let z = 0; z < 16; z++) {
    for (let x = 0; x < 16; x++) {
      ctx.fillStyle = chunk.pixels[z * 16 + x] || chunk.color || "#4f8a3d";
      ctx.fillRect(Math.floor(baseX + x * scale), Math.floor(baseY + z * scale), Math.ceil(scale), Math.ceil(scale));
    }
  }
  return true;
}

function drawVisibleWorldDetails(ctx, width, height, data) {
  if (!state.world.detailCache?.size) return;
  const bounds = worldClipChunkBounds(worldVisibleChunkBounds(width, height, 1), data);
  if (!bounds) return;
  for (const detail of state.world.detailCache.values()) {
    if (detail.x < bounds.minX || detail.x > bounds.maxX || detail.z < bounds.minZ || detail.z > bounds.maxZ) continue;
    drawWorldChunkPixels(ctx, detail);
  }
  const chunkPixels = 16 * state.world.scale;
  if (chunkPixels >= 20) {
    ctx.strokeStyle = "rgba(0,0,0,.28)";
    ctx.lineWidth = 1;
    for (let z = bounds.minZ; z <= bounds.maxZ; z++) {
      for (let x = bounds.minX; x <= bounds.maxX; x++) {
        const sx = x * 16 * state.world.scale + state.world.offsetX;
        const sy = z * 16 * state.world.scale + state.world.offsetY;
        ctx.strokeRect(Math.floor(sx), Math.floor(sy), chunkPixels, chunkPixels);
      }
    }
  }
}

function drawWorldDetailStatus(ctx, width, height) {
  const progress = worldVisibleDetailProgress(width, height);
  if (!progress.total || (progress.loaded >= progress.total && !progress.inflight)) return;
  const text = progress.loaded || progress.inflight
    ? `Loading full detail center-out: ${formatDownloads(progress.loaded)} / ${formatDownloads(progress.total)} tiles`
    : "Starting full detail from the map center...";
  ctx.save();
  ctx.fillStyle = "rgba(5,6,8,.78)";
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.lineWidth = 1;
  const boxW = Math.min(Math.max(220, width - 32), 460);
  ctx.fillRect(16, 42, boxW, 42);
  ctx.strokeRect(16, 42, boxW, 42);
  ctx.fillStyle = "#f6f3ec";
  ctx.font = "700 13px system-ui";
  ctx.fillText(text, 28, 68);
  ctx.restore();
}

function worldVisibleChunkBounds(width, height, pad = 0) {
  const chunkPixels = 16 * state.world.scale;
  return {
    minX: Math.floor((0 - state.world.offsetX) / chunkPixels) - pad,
    maxX: Math.ceil((width - state.world.offsetX) / chunkPixels) + pad,
    minZ: Math.floor((0 - state.world.offsetY) / chunkPixels) - pad,
    maxZ: Math.ceil((height - state.world.offsetY) / chunkPixels) + pad
  };
}

function worldClipChunkBounds(bounds, data) {
  if (!bounds || !data?.bounds) return null;
  const clipped = {
    minX: Math.max(bounds.minX, data.bounds.minX),
    maxX: Math.min(bounds.maxX, data.bounds.maxX),
    minZ: Math.max(bounds.minZ, data.bounds.minZ),
    maxZ: Math.min(bounds.maxZ, data.bounds.maxZ)
  };
  return clipped.minX <= clipped.maxX && clipped.minZ <= clipped.maxZ ? clipped : null;
}

function worldTileKey(tileX, tileZ) {
  return `${tileX}:${tileZ}`;
}

function worldVisibleCenterChunk(width, height) {
  const chunkPixels = 16 * state.world.scale;
  return {
    x: Math.floor(((width / 2) - state.world.offsetX) / chunkPixels),
    z: Math.floor(((height / 2) - state.world.offsetY) / chunkPixels)
  };
}

function worldTileBounds(tileX, tileZ, visibleBounds) {
  const minX = tileX * WORLD_DETAIL_TILE_CHUNKS;
  const minZ = tileZ * WORLD_DETAIL_TILE_CHUNKS;
  const bounds = {
    minX: Math.max(minX, visibleBounds.minX),
    maxX: Math.min(minX + WORLD_DETAIL_TILE_CHUNKS - 1, visibleBounds.maxX),
    minZ: Math.max(minZ, visibleBounds.minZ),
    maxZ: Math.min(minZ + WORLD_DETAIL_TILE_CHUNKS - 1, visibleBounds.maxZ)
  };
  bounds.limit = Math.min(WORLD_DETAIL_LIMIT, Math.max(1, bounds.maxX - bounds.minX + 1) * Math.max(1, bounds.maxZ - bounds.minZ + 1));
  return bounds;
}

function worldVisibleDetailPlan(width, height) {
  const data = state.world.data;
  const visibleBounds = worldClipChunkBounds(worldVisibleChunkBounds(width, height, 1), data);
  if (!visibleBounds) return { bounds: null, tiles: [] };
  const center = worldVisibleCenterChunk(width, height);
  const centerTileX = Math.floor(center.x / WORLD_DETAIL_TILE_CHUNKS);
  const centerTileZ = Math.floor(center.z / WORLD_DETAIL_TILE_CHUNKS);
  const minTileX = Math.floor(visibleBounds.minX / WORLD_DETAIL_TILE_CHUNKS);
  const maxTileX = Math.floor(visibleBounds.maxX / WORLD_DETAIL_TILE_CHUNKS);
  const minTileZ = Math.floor(visibleBounds.minZ / WORLD_DETAIL_TILE_CHUNKS);
  const maxTileZ = Math.floor(visibleBounds.maxZ / WORLD_DETAIL_TILE_CHUNKS);
  const tiles = [];
  for (let tileZ = minTileZ; tileZ <= maxTileZ; tileZ++) {
    for (let tileX = minTileX; tileX <= maxTileX; tileX++) {
      const dx = Math.abs(tileX - centerTileX);
      const dz = Math.abs(tileZ - centerTileZ);
      tiles.push({
        key: worldTileKey(tileX, tileZ),
        tileX,
        tileZ,
        bounds: worldTileBounds(tileX, tileZ, visibleBounds),
        ring: Math.max(dx, dz),
        distance: dx * dx + dz * dz
      });
    }
  }
  tiles.sort((a, b) => a.ring - b.ring || a.distance - b.distance || a.tileZ - b.tileZ || a.tileX - b.tileX);
  return { bounds: visibleBounds, tiles };
}

function worldVisibleDetailProgress(width, height) {
  const plan = worldVisibleDetailPlan(width, height);
  let loaded = 0;
  let inflight = 0;
  let failed = 0;
  for (const tile of plan.tiles) {
    if (state.world.detailLoadedTiles?.has(tile.key)) loaded++;
    if (state.world.detailInflightTiles?.has(tile.key)) inflight++;
    if (state.world.detailFailedTiles?.has(tile.key)) failed++;
  }
  return { total: plan.tiles.length, loaded, inflight, failed };
}

function queueVisibleWorldDetails(width, height) {
  if (!state.world.data?.chunks?.length) return;
  const plan = worldVisibleDetailPlan(width, height);
  if (!plan.tiles.length) return;
  let slots = Math.max(0, WORLD_DETAIL_CONCURRENCY - (state.world.detailInflightTiles?.size || 0));
  if (!slots) return;
  const now = Date.now();
  for (const tile of plan.tiles) {
    if (state.world.detailLoadedTiles?.has(tile.key) || state.world.detailInflightTiles?.has(tile.key)) continue;
    const failedAt = state.world.detailFailedTiles?.get(tile.key);
    if (failedAt && now - failedAt < WORLD_DETAIL_RETRY_MS) continue;
    loadWorldDetailTile(tile);
    slots--;
    if (!slots) break;
  }
}

async function loadWorldDetailTile(tile) {
  const token = state.world.detailToken;
  const requestServerId = selectedServerIdForApi();
  const requestDimension = state.world.dimension;
  state.world.detailInflightTiles.add(tile.key);
  state.world.detailFailedTiles.delete(tile.key);
  try {
    const detail = await api("/api/world/map?" + q({
      serverId: requestServerId,
      dimension: requestDimension,
      detail: "1",
      limit: tile.bounds.limit,
      minX: tile.bounds.minX,
      maxX: tile.bounds.maxX,
      minZ: tile.bounds.minZ,
      maxZ: tile.bounds.maxZ
    }));
    if (token !== state.world.detailToken || requestServerId !== selectedServerIdForApi() || requestDimension !== state.world.dimension) return;
    for (const chunk of detail.chunks || []) {
      if (chunk.pixels?.length) state.world.detailCache.set(worldChunkKey(chunk.x, chunk.z), chunk);
    }
    state.world.detailLoadedTiles.add(tile.key);
  } catch (error) {
    if (token === state.world.detailToken) state.world.detailFailedTiles.set(tile.key, Date.now());
  } finally {
    if (token === state.world.detailToken) {
      state.world.detailInflightTiles.delete(tile.key);
      window.clearTimeout(state.world.detailTimer);
      state.world.detailTimer = window.setTimeout(() => {
        if (state.page === "world") drawWorldMap();
      }, 40);
    }
  }
}

function drawWorldPlayers(ctx) {
  const players = (state.world.players || []).filter(player => player.available !== false && normalizeWorldDimension(player.dimension) === state.world.dimension);
  if (!players.length) return;
  const scale = state.world.scale;
  for (const player of players) {
    const x = Number(player.x) * scale + state.world.offsetX;
    const y = Number(player.z) * scale + state.world.offsetY;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#2f8cff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -13);
    ctx.lineTo(5, -4);
    ctx.lineTo(-5, -4);
    ctx.closePath();
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 12px system-ui";
    ctx.shadowColor = "rgba(0,0,0,.8)";
    ctx.shadowBlur = 4;
    ctx.fillText(player.name || "Player", 10, -10);
    ctx.restore();
  }
}

function ensureWorldOverviewBitmap(data) {
  if (!data?.chunks?.length) return null;
  const width = data.bounds.maxX - data.bounds.minX + 1;
  const height = data.bounds.maxZ - data.bounds.minZ + 1;
  const key = [data.serverId, data.dimension, data.limit, data.mode, data.chunks.length, data.bounds.minX, data.bounds.maxX, data.bounds.minZ, data.bounds.maxZ].join(":");
  if (state.world.bitmap?.key === key) return state.world.bitmap;
  if (width <= 0 || height <= 0 || width > 8192 || height > 8192 || width * height > 12000000) {
    state.world.bitmap = { key, sparse: true, index: buildWorldChunkIndex(data.chunks) };
    return state.world.bitmap;
  }
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(width, height);
  for (const chunk of data.chunks) {
    const x = chunk.x - data.bounds.minX;
    const z = chunk.z - data.bounds.minZ;
    if (x < 0 || z < 0 || x >= width || z >= height) continue;
    const color = hexToRgb(chunk.color || "#4f8a3d");
    const offset = (z * width + x) * 4;
    image.data[offset] = color.r;
    image.data[offset + 1] = color.g;
    image.data[offset + 2] = color.b;
    image.data[offset + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
  state.world.bitmap = { key, canvas, width, height };
  return state.world.bitmap;
}

function buildWorldChunkIndex(chunks) {
  const tileSize = 64;
  const tiles = new Map();
  for (const chunk of chunks || []) {
    const key = Math.floor(chunk.x / tileSize) + ":" + Math.floor(chunk.z / tileSize);
    if (!tiles.has(key)) tiles.set(key, []);
    tiles.get(key).push(chunk);
  }
  return { tileSize, tiles };
}

function visibleWorldOverviewChunks(bitmap, width, height, scale) {
  const index = bitmap.index;
  if (!index) return [];
  const chunkPixels = 16 * scale;
  const minX = Math.floor((0 - state.world.offsetX) / chunkPixels) - 1;
  const maxX = Math.ceil((width - state.world.offsetX) / chunkPixels) + 1;
  const minZ = Math.floor((0 - state.world.offsetY) / chunkPixels) - 1;
  const maxZ = Math.ceil((height - state.world.offsetY) / chunkPixels) + 1;
  const minTileX = Math.floor(minX / index.tileSize);
  const maxTileX = Math.floor(maxX / index.tileSize);
  const minTileZ = Math.floor(minZ / index.tileSize);
  const maxTileZ = Math.floor(maxZ / index.tileSize);
  const chunks = [];
  for (let tileZ = minTileZ; tileZ <= maxTileZ; tileZ++) {
    for (let tileX = minTileX; tileX <= maxTileX; tileX++) {
      for (const chunk of index.tiles.get(tileX + ":" + tileZ) || []) {
        if (chunk.x >= minX && chunk.x <= maxX && chunk.z >= minZ && chunk.z <= maxZ) chunks.push(chunk);
      }
    }
  }
  return chunks;
}

function hexToRgb(hex) {
  const value = String(hex || "").replace("#", "");
  const parsed = /^[0-9a-fA-F]{6}$/.test(value) ? parseInt(value, 16) : 0x4f8a3d;
  return { r: (parsed >> 16) & 255, g: (parsed >> 8) & 255, b: parsed & 255 };
}

function normalizeWorldDimension(value) {
  const text = String(value || "").toLowerCase();
  if (text.includes("the_nether") || text.includes("nether")) return "nether";
  if (text.includes("the_end") || text === "end") return "end";
  if (text.includes("overworld")) return "overworld";
  return text || state.world.dimension;
}

async function loadWorldPlayers(force = false) {
  if (state.page !== "world") return;
  if (state.world.playersLoading && !force) return;
  const token = ++state.world.playersToken;
  state.world.playersLoading = true;
  updateWorldPlayerPanel();
  try {
    const data = await api("/api/world/players?" + q({ serverId: selectedServerIdForApi(), refresh: force ? "1" : "0" }));
    if (token !== state.world.playersToken) return;
    state.world.players = (data.players || []).map(player => ({ ...player, dimension: normalizeWorldDimension(player.dimension) }));
  } catch (error) {
    if (force) notice(error.message, true);
  } finally {
    if (token === state.world.playersToken) {
      state.world.playersLoading = false;
      updateWorldPlayerPanel();
      drawWorldMap();
    }
  }
}

function updateWorldPlayerPanel() {
  const panel = $("world-player-panel");
  if (panel) panel.innerHTML = worldPlayerPanelHtml();
  const refresh = $("world-players-refresh");
  if (refresh) refresh.onclick = () => loadWorldPlayers(true);
  document.querySelectorAll("[data-world-player-jump]").forEach(button => {
    button.onclick = () => jumpToWorldPlayer(button.dataset.worldPlayerJump);
  });
}

function jumpToWorldPlayer(name) {
  const player = (state.world.players || []).find(item => item.name === name);
  if (!player || player.available === false) return;
  const targetDimension = normalizeWorldDimension(player.dimension);
  const jump = () => centerWorldOnBlock(Number(player.x), Number(player.z), Math.max(state.world.scale, 1.8));
  if (targetDimension && targetDimension !== state.world.dimension) {
    state.world.pendingJump = { dimension: targetDimension, x: Number(player.x), z: Number(player.z), scale: Math.max(state.world.scale, 1.8) };
    state.world.dimension = targetDimension;
    state.world.data = null;
    resetWorldRenderCaches();
    state.world.centered = false;
    renderWorld();
    return;
  }
  jump();
}

function drawWorldCoordinates(ctx, minBlockX, maxBlockX, minBlockZ, maxBlockZ) {
  const canvas = $("world-canvas");
  const rect = canvas?.getBoundingClientRect();
  const width = rect?.width || 0;
  const height = rect?.height || 0;
  const originX = state.world.offsetX;
  const originY = state.world.offsetY;
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.34)";
  ctx.lineWidth = 1;
  if (originX >= 0 && originX <= width) {
    ctx.beginPath();
    ctx.moveTo(Math.floor(originX) + 0.5, 0);
    ctx.lineTo(Math.floor(originX) + 0.5, height);
    ctx.stroke();
  }
  if (originY >= 0 && originY <= height) {
    ctx.beginPath();
    ctx.moveTo(0, Math.floor(originY) + 0.5);
    ctx.lineTo(width, Math.floor(originY) + 0.5);
    ctx.stroke();
  }
  if (originX >= 0 && originX <= width && originY >= 0 && originY <= height) {
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 12px system-ui";
    ctx.fillText("0,0", originX + 8, originY - 8);
  }
  ctx.restore();
  ctx.fillStyle = "rgba(246,243,236,.78)";
  ctx.font = "12px system-ui";
  ctx.fillText("x " + minBlockX + "..." + (maxBlockX - 1) + " / z " + minBlockZ + "..." + (maxBlockZ - 1), 12, 20);
}

function drawWorldTrimOverlay(ctx) {
  const areas = [...state.world.trimAreas];
  if (state.world.trimDraft) areas.push(state.world.trimDraft);
  areas.forEach((area, index) => {
    const rect = trimAreaScreenRect(area);
    ctx.fillStyle = index === areas.length - 1 && state.world.trimDraft ? "rgba(75,156,255,.18)" : "rgba(13,181,13,.16)";
    ctx.strokeStyle = index === areas.length - 1 && state.world.trimDraft ? "rgba(75,156,255,.95)" : "rgba(13,181,13,.95)";
    ctx.lineWidth = 2;
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = "#fff";
    ctx.font = "12px system-ui";
    ctx.fillText(index === areas.length - 1 && state.world.trimDraft ? "Keep preview" : `Keep ${index + 1}`, rect.x + 6, rect.y + 18);
  });
}

function trimAreaScreenRect(area) {
  const scale = state.world.scale;
  const x = area.minChunkX * 16 * scale + state.world.offsetX;
  const y = area.minChunkZ * 16 * scale + state.world.offsetY;
  const w = (area.maxChunkX - area.minChunkX + 1) * 16 * scale;
  const h = (area.maxChunkZ - area.minChunkZ + 1) * 16 * scale;
  return { x, y, w, h };
}

function trimAreaLabel(area) {
  const minBlockX = area.minChunkX * 16;
  const maxBlockX = (area.maxChunkX + 1) * 16 - 1;
  const minBlockZ = area.minChunkZ * 16;
  const maxBlockZ = (area.maxChunkZ + 1) * 16 - 1;
  const chunks = (area.maxChunkX - area.minChunkX + 1) * (area.maxChunkZ - area.minChunkZ + 1);
  return `x ${minBlockX}..${maxBlockX}, z ${minBlockZ}..${maxBlockZ} / ${chunks} chunks`;
}

function worldSelectedGeneratedCount(data) {
  if (!data?.chunks?.length || !state.world.trimAreas.length) return 0;
  return data.chunks.filter(chunk => state.world.trimAreas.some(area => chunk.x >= area.minChunkX && chunk.x <= area.maxChunkX && chunk.z >= area.minChunkZ && chunk.z <= area.maxChunkZ)).length;
}

async function applyWorldTrim(button) {
  if (!state.world.trimAreas.length) return;
  const count = state.world.trimAreas.length;
  const generated = worldSelectedGeneratedCount(state.world.data);
  const message = `Keep ${count} selected area${count === 1 ? "" : "s"} in ${state.world.dimension} and delete all generated chunks outside them? MineMux will create a backup first.${generated ? ` ${generated} visible generated chunks are inside the selection.` : ""}`;
  if (!confirm(message)) return;
  try {
    const result = await run(button, () => post("/api/world/trim?" + q({ serverId: selectedServerIdForApi() }), {
      dimension: state.world.dimension,
      areas: state.world.trimAreas
    }));
    state.world.trimAreas = [];
    state.world.trimDraft = null;
    state.world.trimAnchor = null;
    state.world.trimMode = false;
    notice(`Trimmed ${result.deletedChunks || 0} chunks. Backup: ${result.backupId || "created"}`);
    await loadWorldMap(true);
    await refresh(false);
  } catch (error) {
    notice(error.message, true);
  }
}

async function loadFiles(shouldRender = true) {
  const data = await api("/api/server/files?" + q({ path: state.filePath, serverId: selectedServerIdForApi() }));
  state.files = data.files || [];
  if (shouldRender) render();
}

function renderFiles() {
  $("content").innerHTML = `<div class="cols">
    <div class="card">
      <div class="section-head">
        <div><h2>Files</h2><p class="muted">${esc(state.filePath || "Server root")}</p></div>
        <div class="row"><button id="file-up" ${state.filePath ? "" : "disabled"}>Up</button><button id="file-upload">Upload Files</button><button id="folder-upload">Upload Folder</button></div>
      </div>
      ${fileBreadcrumbHtml()}
      <div class="drop-zone" style="margin-bottom:12px">
        <b>${fileSummaryHtml()}</b>
        <div class="muted">Use Upload Folder to preserve subfolders inside the current location.</div>
      </div>
      <div class="list" id="files-list">${filesListHtml()}</div>
    </div>
    <div id="file-editor-panel">${fileEditorHtml()}</div>
  </div>`;
  $("file-up").onclick = async () => { state.filePath = state.filePath.split("/").slice(0, -1).join("/"); state.fileEditor = null; await loadFiles(); };
  $("file-upload").onclick = () => $("server-upload").click();
  $("folder-upload").onclick = () => $("server-folder-upload").click();
  wireFileButtons();
  wireFileEditor();
}

function fileSummaryHtml() {
  const folders = state.files.filter(file => file.directory).length;
  const files = state.files.length - folders;
  const total = state.files.reduce((sum, file) => sum + Number(file.sizeBytes || 0), 0);
  return `${files} files, ${folders} folders, ${bytes(total)}`;
}

function filesListHtml() {
  return state.files.map(fileRow).join("") || emptyState("This folder is empty", "Upload a file here or move up to another folder.");
}

function fileBreadcrumbHtml() {
  const parts = state.filePath ? state.filePath.split("/").filter(Boolean) : [];
  let path = "";
  const buttons = [`<button data-file-path="">Root</button>`].concat(parts.map(part => {
    path = path ? `${path}/${part}` : part;
    return `<button data-file-path="${esc(path)}">${esc(part)}</button>`;
  }));
  return `<div class="file-breadcrumb">${buttons.join("<span class=\"dim\">/</span>")}</div>`;
}

function updateFilesListOnly() {
  const target = $("files-list");
  if (target) {
    const next = filesListHtml();
    if (target.innerHTML !== next) target.innerHTML = next;
    wireFileButtons();
  }
}

function fileRow(file) {
  const type = file.directory ? "Folder" : bytes(file.sizeBytes);
  return `<div class="item between"><div><span class="file-type">${file.directory ? "DIR" : "FILE"}</span><b style="display:block;margin-top:3px">${esc(file.name)}</b><div class="muted">${type}</div></div><div class="row">${file.directory ? `<button data-open="${esc(file.path)}">Open</button>` : `<button data-edit-file="${esc(file.path)}">Edit</button>`}<a href="/api/server/file?${q({ path: file.path, serverId: selectedServerIdForApi() })}"><button>Download</button></a><button data-delete-file="${esc(file.path)}" class="danger">Delete</button></div></div>`;
}

function wireFileButtons() {
  document.querySelectorAll("[data-file-path]").forEach(b => b.onclick = async () => { state.filePath = b.dataset.filePath; state.fileEditor = null; await loadFiles(); });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = async () => { state.filePath = b.dataset.open; state.fileEditor = null; await loadFiles(); });
  document.querySelectorAll("[data-edit-file]").forEach(b => b.onclick = () => openFileEditor(b.dataset.editFile));
  document.querySelectorAll("[data-delete-file]").forEach(b => b.onclick = async () => { if (confirm("Delete file/folder?")) { await del("/api/server/file?" + q({ path: b.dataset.deleteFile, serverId: selectedServerIdForApi() })); if (state.fileEditor?.path === b.dataset.deleteFile) state.fileEditor = null; await loadFiles(); } });
}

async function openFileEditor(path) {
  try {
    const data = await api("/api/server/file?" + q({ path, raw: "1", serverId: selectedServerIdForApi() }));
    state.fileEditor = { path, content: data.content || "" };
    const panel = $("file-editor-panel");
    if (panel) {
      panel.innerHTML = fileEditorHtml();
      wireFileEditor();
    }
  } catch (error) {
    notice(error.message, true);
  }
}

function fileEditorHtml() {
  if (!state.fileEditor) return `<div class="card"><h2>Editor</h2><p class="muted">Select a text file to edit it live.</p></div>`;
  return `<div class="card"><div class="between"><h2>Edit File</h2><button id="close-editor">Close</button></div><p class="muted">${esc(state.fileEditor.path)}</p><textarea id="file-editor-text" spellcheck="false">${esc(state.fileEditor.content)}</textarea><div class="row" style="margin-top:12px"><button class="primary" id="save-editor">Save</button><button id="reload-editor">Reload</button></div></div>`;
}

function wireFileEditor() {
  const close = $("close-editor");
  if (close) close.onclick = () => { state.fileEditor = null; $("file-editor-panel").innerHTML = fileEditorHtml(); };
  const save = $("save-editor");
  if (save) save.onclick = async () => {
    const content = $("file-editor-text").value;
    await run(save, () => api("/api/server/file?" + q({ path: state.fileEditor.path, serverId: selectedServerIdForApi() }), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content }) }));
    state.fileEditor.content = content;
    notice("File saved");
  };
  const reload = $("reload-editor");
  if (reload) reload.onclick = () => openFileEditor(state.fileEditor.path);
}

function renderSettings() {
  const profile = state.status?.profile || {};
  $("content").innerHTML = `<div class="grid"><div class="card"><h2>Preferences</h2><label class="row"><input id="set-autostart" type="checkbox" style="width:auto" ${profile.features?.autoStart ? "checked" : ""}> Start active server on phone boot</label><label class="row"><input id="set-restart" type="checkbox" style="width:auto" ${profile.features?.restartOnCrash !== false ? "checked" : ""}> Auto-restart on crash</label></div><div class="card"><h2>Advanced</h2><div class="row"><button onclick="location.href='/'">Web UI</button><button id="refresh-settings">Refresh</button></div></div></div>`;
  $("set-autostart").onchange = e => post("/api/config", { autoStart: e.target.checked }).then(refresh).catch(err => notice(err.message, true));
  $("set-restart").onchange = e => post("/api/config", { restartOnCrash: e.target.checked }).then(refresh).catch(err => notice(err.message, true));
  $("refresh-settings").onclick = refresh;
}

async function renderTermux() {
  $("content").innerHTML = `<div class="grid">
    <div class="card">
      <div class="section-head">
        <div><h2>Termux Shell</h2><p class="muted" id="termux-info">Loading shell info...</p></div>
        <button id="termux-clear">Clear</button>
      </div>
      <div class="console terminal-output" id="termux-output">${esc(state.termux.output || "Run a command to see output here.")}</div>
      <div class="row" style="margin-top:12px">
        <input id="termux-cwd" style="max-width:320px" placeholder="Working directory">
        <input id="termux-command" class="grow" placeholder="pkg list-installed | head">
        <button class="primary" id="termux-run">Run</button>
      </div>
    </div>
  </div>`;
  try {
    state.termux.info = state.termux.info || await api("/api/termux/info");
    state.termux.cwd = state.termux.cwd || state.termux.info.cwd || state.termux.info.home || "";
    setText("termux-info", `${state.termux.info.shell || "sh"} / ${state.termux.cwd}`);
    $("termux-cwd").value = state.termux.cwd;
  } catch (error) {
    setText("termux-info", error.message);
  }
  $("termux-clear").onclick = () => { state.termux.output = ""; $("termux-output").textContent = "Cleared."; };
  $("termux-run").onclick = () => runTermuxCommand();
  $("termux-command").onkeydown = event => {
    if (event.key === "Enter") {
      event.preventDefault();
      runTermuxCommand();
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      if (!state.termux.history.length) return;
      if (state.termux.historyIndex < 0) state.termux.historyIndex = state.termux.history.length;
      state.termux.historyIndex = Math.max(0, state.termux.historyIndex - 1);
      $("termux-command").value = state.termux.history[state.termux.historyIndex] || "";
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (!state.termux.history.length) return;
      state.termux.historyIndex = Math.min(state.termux.history.length, state.termux.historyIndex + 1);
      $("termux-command").value = state.termux.history[state.termux.historyIndex] || "";
    }
  };
}

async function runTermuxCommand() {
  const input = $("termux-command");
  const button = $("termux-run");
  const command = input.value.trim();
  if (!command) return;
  const cwd = $("termux-cwd").value.trim();
  state.termux.cwd = cwd;
  if (state.termux.history[state.termux.history.length - 1] !== command) {
    state.termux.history.push(command);
    if (state.termux.history.length > 50) state.termux.history.shift();
  }
  state.termux.historyIndex = state.termux.history.length;
  button.disabled = true;
  const started = new Date().toLocaleTimeString();
  state.termux.output += `\n$ ${command}\n`;
  $("termux-output").textContent = state.termux.output;
  try {
    const res = await post("/api/termux/command", { command, cwd, timeoutSeconds: 60 });
    state.termux.output += `${res.stdout || ""}${res.stderr || ""}\n[exit ${res.exitCode} / ${res.durationMs}ms / ${started}]\n`;
    $("termux-output").textContent = state.termux.output;
    $("termux-output").scrollTop = $("termux-output").scrollHeight;
    input.value = "";
  } catch (error) {
    state.termux.output += `Error: ${error.message}\n`;
    $("termux-output").textContent = state.termux.output;
  } finally {
    button.disabled = false;
  }
}

function renderConsole() {
  $("content").innerHTML = `<div class="card"><h2>Live Console</h2><div class="console" id="console">Loading logs...</div><div class="row" style="margin-top:12px"><input id="console-command" class="grow" placeholder="say Hello"><button id="send-console">Send</button></div></div>`;
  $("send-console").onclick = () => sendCommandFromInput("console-command").catch(error => notice(error.message, true));
  wireCommandInput("console-command");
  loadLogs("console");
}

async function loadLogs(id) {
  try {
    const data = await api("/api/server/logs");
    state.logs = data.lines || [];
    const target = $(id);
    if (target) target.textContent = state.logs.slice(-80).join("\n") || "No logs yet.";
  } catch {}
}

function wireCommandInput(id) {
  const input = $(id);
  if (!input) return;
  input.onkeydown = event => {
    if (event.key === "Enter") {
      event.preventDefault();
      sendCommandFromInput(id).catch(error => notice(error.message, true));
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      if (!state.commandHistory.length) return;
      if (state.commandHistoryIndex < 0) state.commandHistoryIndex = state.commandHistory.length;
      state.commandHistoryIndex = Math.max(0, state.commandHistoryIndex - 1);
      input.value = state.commandHistory[state.commandHistoryIndex] || "";
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (!state.commandHistory.length) return;
      state.commandHistoryIndex = Math.min(state.commandHistory.length, state.commandHistoryIndex + 1);
      input.value = state.commandHistory[state.commandHistoryIndex] || "";
    }
  };
}

async function sendCommandFromInput(id) {
  const input = $(id);
  const sent = await sendCommand(input?.value || "");
  if (sent && input) input.value = "";
}

async function sendCommand(command) {
  command = (command || "").trim();
  if (!command) return false;
  if (state.commandHistory[state.commandHistory.length - 1] !== command) {
    state.commandHistory.push(command);
    if (state.commandHistory.length > 40) state.commandHistory.shift();
  }
  state.commandHistoryIndex = state.commandHistory.length;
  await post("/api/server/command", { command });
  notice("Command sent");
  await loadLogs("console");
  await loadLogs("dash-console");
  return true;
}

async function uploadTo(endpoint, input, onDone, options = {}) {
  const files = Array.from(input.files || []);
  if (!files.length) return null;
  const form = new FormData();
  files.forEach(file => form.append("file", file, options.preservePath ? (file.webkitRelativePath || file.name) : file.name));
  try {
    const res = await fetch(endpoint, { method: "POST", body: form });
    if (!res.ok) throw new Error(await res.text());
    const data = res.headers.get("content-type")?.includes("application/json") ? await res.json() : await res.text();
    if (onDone) await onDone(data);
    return data;
  } finally {
    input.value = "";
  }
}

$("backup-upload").onchange = e => uploadTo("/api/backups/upload?restore=true", e.target, refresh).catch(err => notice(err.message, true));
$("server-upload").onchange = e => uploadTo("/api/server/file/upload?" + q({ path: state.filePath, serverId: selectedServerIdForApi() }), e.target, () => loadFiles()).catch(err => notice(err.message, true));
$("server-folder-upload").onchange = e => uploadTo("/api/server/file/upload?" + q({ path: state.filePath, serverId: selectedServerIdForApi(), tree: "1" }), e.target, () => loadFiles(), { preservePath: true }).catch(err => notice(err.message, true));
$("mod-upload").onchange = e => uploadTo("/api/mods/upload?" + q({ serverId: selectedServerIdForApi() }), e.target, () => refresh(true)).catch(err => notice(err.message, true));
$("server-icon-upload").onchange = e => uploadTo("/api/server/icon?" + q({ serverId: state.selectedServerId }), e.target, refresh).catch(err => notice(err.message, true));
$("resource-pack-upload").onchange = e => uploadTo("/api/server/resource-pack?" + q({ serverId: selectedServerIdForApi() }), e.target, refresh).catch(err => notice(err.message, true));
$("setup-world-upload").onchange = e => {
  if (!e.target.files?.length) return;
  state.setupWorldUploading = true;
  syncSetupWorldUploadControls();
  const seed = $("setup-seed");
  seed?.dispatchEvent(new Event("input"));
  uploadTo("/api/server/setup/world", e.target, null).then(data => {
    if (!data) return;
    state.setupWorldUpload = data;
    notice("World upload ready");
    if (seed) seed.value = "";
  }).catch(err => notice(err.message, true)).finally(() => {
    state.setupWorldUploading = false;
    syncSetupWorldUploadControls();
    seed?.dispatchEvent(new Event("input"));
  });
};
$("refresh").onclick = refresh;

setInterval(() => {
  refresh();
  if (state.page === "console" || state.page === "dashboard") loadLogs(state.page === "console" ? "console" : "dash-console");
  if (state.setupProgress) updateSetupProgress();
}, 3000);
refresh();
</script>
</body>
</html>
