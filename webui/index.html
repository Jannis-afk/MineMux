<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineMux</title>
  <link rel="icon" type="image/png" href="/assets/app-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0e;
      --panel: #141518;
      --panel-2: #202228;
      --line: #343841;
      --text: #f6f3ec;
      --muted: #b8b4aa;
      --dim: #858176;
      --green: #0db50d;
      --blue: #4b9cff;
      --amber: #d59b32;
      --red: #d64040;
      --warn: #d59b32;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 15% 0%, rgba(75,156,255,.10), transparent 30rem), radial-gradient(circle at 90% 8%, rgba(213,155,50,.08), transparent 26rem), var(--bg); }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
    aside { border-right: 1px solid var(--line); background: #101114; padding: 18px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; gap: 10px; align-items: center; font-size: 24px; font-weight: 800; margin-bottom: 22px; }
    .logo { width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(13,181,13,.45); object-fit: cover; background: #050505; }
    .title-logo { width: 42px; height: 42px; border-radius: 8px; border: 1px solid rgba(13,181,13,.45); object-fit: cover; background: #050505; }
    nav { display: grid; gap: 8px; }
    .nav { border: 1px solid transparent; color: var(--muted); background: transparent; border-radius: 8px; padding: 12px 14px; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav:hover { color: var(--text); background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); }
    .nav.active { color: #fff; background: rgba(13,181,13,.16); border-color: rgba(13,181,13,.45); box-shadow: inset 3px 0 0 var(--green); }
    main { padding: 20px; max-width: 1320px; width: 100%; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 16px; }
    .header-tools { justify-content: flex-end; }
    .server-switcher { width: auto; min-width: 190px; max-width: 290px; }
    h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); line-height: 1; }
    h2 { margin: 0 0 12px; font-size: 19px; }
    h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 650; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .grid { display: grid; gap: 12px; }
    .cols { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; align-items: start; }
    .servers-layout { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 14px; align-items: start; }
    .server-list-card { position: sticky; top: 20px; }
    .server-row { display: grid; gap: 10px; cursor: pointer; }
    .server-row.selected { border-color: var(--green); box-shadow: inset 3px 0 0 var(--green); }
    .server-row-title { font-size: 18px; font-weight: 850; }
    .detail-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
    .detail-hero h2 { margin: 0 0 6px; font-size: 26px; }
    .server-detail-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr); gap: 12px; align-items: start; }
    .server-kv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .mini-card { border: 1px solid var(--line); background: #101114; border-radius: 8px; padding: 12px; min-height: 74px; }
    .mini-card b { display: block; margin-top: 5px; font-size: 17px; }
    .detail-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
    .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .section-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .inline-note { border: 1px solid rgba(75,156,255,.3); background: rgba(75,156,255,.08); color: #e4efff; border-radius: 8px; padding: 12px; }
    .hint { color: var(--dim); font-size: 12px; line-height: 1.35; }
    .tight-list { display: grid; gap: 6px; }
    .compact-item { padding: 10px; }
    .map-link { color: var(--green); font-weight: 800; text-decoration: none; }
    .metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { background: linear-gradient(180deg, var(--panel), #101114); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.22); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; background: rgba(166,166,166,.12); color: var(--muted); font-size: 12px; font-weight: 800; }
    .pill.green { background: rgba(13,181,13,.16); color: var(--green); }
    .pill.blue { background: rgba(75,156,255,.16); color: var(--blue); }
    .pill.amber { background: rgba(213,155,50,.16); color: var(--amber); }
    .pill.red { background: rgba(214,64,64,.15); color: #ff7777; }
    .dot { width: 8px; height: 8px; background: currentColor; border-radius: 50%; display: inline-block; }
    .runtime { width: 52px; height: 52px; border-radius: 8px; display: grid; place-items: center; background: rgba(13,181,13,.12); border: 1px solid rgba(13,181,13,.35); color: var(--green); font-weight: 900; }
    .metric { min-height: 114px; display: grid; align-content: space-between; }
    .metric .value { font-size: 24px; font-weight: 850; }
    .spark { height: 34px; width: 100%; }
    .spark.empty { opacity: .25; }
    .spark svg { width: 100%; height: 34px; display: block; overflow: visible; }
    .spark polygon { fill: rgba(13,181,13,.15); }
    .spark polyline { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 12px; }
    button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 11px 13px; cursor: pointer; font-weight: 750; transition: border-color .15s ease, background .15s ease, transform .15s ease; }
    button:hover { border-color: var(--green); }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--green); border-color: var(--green); color: #fff; }
    button.danger { background: var(--red); border-color: var(--red); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid rgba(75,156,255,.75); outline-offset: 2px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); background: #0e0f12; color: var(--text); border-radius: 8px; padding: 11px 12px; }
    textarea { min-height: 120px; resize: vertical; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .slider-field { grid-column: 1 / -1; gap: 10px; }
    .slider-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .slider-top b { color: var(--text); font-size: 15px; }
    input[type="range"] { padding: 0; accent-color: var(--green); }
    .range-ticks { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); font-size: 11px; font-weight: 750; }
    .setup-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: 12px; align-items: start; }
    .setup-section { display: grid; gap: 10px; }
    .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .toggle-row { display: flex; align-items: start; gap: 10px; border: 1px solid var(--line); background: #101114; border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; font-weight: 750; }
    .toggle-row input { width: auto; margin-top: 3px; }
    .toggle-row span { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-top: 3px; }
    .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
    .provider-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .provider-tabs button.active { border-color: var(--green); background: rgba(13,181,13,.16); color: var(--green); }
    .mod-browser { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .42fr); gap: 12px; align-items: start; }
    .mod-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
    .mod-icon { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: #07080a; border: 1px solid var(--line); }
    .mod-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .mod-version-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 10px; }
    .progress-shell { border: 1px solid var(--line); background: #101114; border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
    .progress-track { height: 8px; border-radius: 999px; background: #08090b; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
    .progress-fill { height: 100%; width: 8%; background: var(--green); transition: width .4s ease; }
    .drop-zone { border: 1px dashed rgba(184,180,170,.34); background: rgba(255,255,255,.025); border-radius: 8px; padding: 14px; display: grid; gap: 6px; }
    .terminal-output { min-height: 420px; height: 58vh; }
    .empty-state { border: 1px dashed rgba(184,180,170,.28); background: rgba(255,255,255,.025); border-radius: 8px; padding: 18px; display: grid; gap: 8px; }
    .empty-state h3 { color: var(--text); font-size: 17px; }
    .empty-state p { margin: 0; }
    .empty-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .world-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .world-toolbar select { width: auto; min-width: 180px; }
    .world-limit { min-width: min(100%, 340px); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .world-limit input { min-width: 150px; }
    .world-limit b { color: var(--text); white-space: nowrap; }
    .world-zoom-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .world-canvas-wrap { height: min(68vh, 720px); min-height: 420px; overflow: hidden; padding: 0; position: relative; }
    .world-canvas { width: 100%; height: 100%; display: block; background: #050608; cursor: grab; touch-action: none; image-rendering: pixelated; }
    .world-canvas.dragging { cursor: grabbing; }
    .world-canvas.trimming { cursor: crosshair; }
    .world-legend { position: absolute; left: 12px; bottom: 12px; max-width: min(460px, calc(100% - 24px)); background: rgba(16,17,20,.88); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; pointer-events: none; }
    .world-coordinates { position: absolute; right: 12px; top: 12px; max-width: min(520px, calc(100% - 24px)); background: rgba(5,6,8,.9); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; pointer-events: none; color: var(--text); font-size: 12px; font-weight: 900; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
    .world-coordinates .muted { font-size: 11px; font-weight: 800; }
    .world-trim-panel { margin-top: 10px; display: grid; gap: 8px; }
    .world-trim-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .list { display: grid; gap: 8px; }
    .item { border: 1px solid var(--line); background: #101114; border-radius: 8px; padding: 12px; }
    .item.active { border-color: var(--green); }
    .file-breadcrumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
    .file-breadcrumb button { padding: 7px 9px; }
    .file-type { color: var(--dim); font-size: 12px; font-weight: 800; letter-spacing: 0; }
    .console { background: #07080a; border: 1px solid var(--line); border-radius: 8px; padding: 12px; height: 280px; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .hidden { display: none !important; }
    .notice { position: fixed; right: 18px; bottom: 18px; max-width: 380px; background: #101114; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 8px; padding: 12px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.35); z-index: 20; }
    .notice.error { border-left-color: var(--red); }
    .file-input { display: none; }
    iframe { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 8px; background: #080808; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { position: fixed; inset: auto 10px 10px; height: auto; z-index: 10; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
      .brand { display: none; }
      nav { grid-auto-flow: column; grid-auto-columns: minmax(86px, 1fr); grid-template-columns: none; gap: 4px; overflow-x: auto; scrollbar-width: none; }
      nav::-webkit-scrollbar { display: none; }
      .nav { text-align: center; padding: 10px 4px; font-size: 11px; }
      .nav.active { box-shadow: inset 0 -3px 0 var(--green); }
      main { padding: 16px 12px 104px; }
      header { align-items: stretch; flex-direction: column; }
      .header-tools { justify-content: space-between; }
      .server-switcher { min-width: 0; flex: 1; }
      .cols, .metrics, .servers-layout, .server-detail-grid, .setup-grid { grid-template-columns: 1fr; }
      .server-list-card { position: static; }
      .actions { grid-template-columns: repeat(2, 1fr); }
      .server-kv-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .cols, .metrics, .actions, .detail-hero, .server-kv-grid { grid-template-columns: 1fr; }
      .nav { font-size: 10px; }
      .world-canvas-wrap { min-height: 330px; height: 58vh; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img class="logo" src="/assets/app-icon.png" alt=""><span>MineMux</span></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <div class="row">
        <img class="title-logo" src="/assets/app-icon.png" alt="">
        <div>
          <h1 id="title">Dashboard</h1>
          <div class="muted" id="subtitle">Phone-hosted Minecraft server control.</div>
        </div>
      </div>
      <div class="row header-tools">
        <select id="server-switcher" class="server-switcher hidden" aria-label="Selected server"></select>
        <span class="pill" id="controller-pill"><span class="dot"></span>Loading</span>
        <button id="refresh">Refresh</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="notice" class="notice hidden"></div>
<input id="backup-upload" class="file-input" type="file" accept=".zip">
<input id="server-upload" class="file-input" type="file" multiple>
<input id="server-folder-upload" class="file-input" type="file" webkitdirectory directory multiple>
<input id="mod-upload" class="file-input" type="file" accept=".jar">
<input id="server-icon-upload" class="file-input" type="file" accept="image/png">
<input id="resource-pack-upload" class="file-input" type="file" accept=".zip">
<input id="setup-world-upload" class="file-input" type="file" accept=".zip">
<script>
const state = {
  page: new URLSearchParams(location.search).get("page") || "dashboard",
  status: null,
  servers: [],
  backups: [],
  mods: null,
  modsByServer: {},
  modProvider: "all",
  modProviders: null,
  setupWorldUpload: null,
  setupWorldUploading: false,
  setupProgress: null,
  setupProgressTimer: null,
  termux: { info: null, cwd: "", output: "", history: [], historyIndex: -1 },
  updates: null,
  files: [],
  fileEditor: null,
  filePath: "",
  world: {
    data: null,
    dimension: "overworld",
    scale: 0.35,
    offsetX: 0,
    offsetY: 0,
    dragging: false,
    centered: false,
    limit: 10000,
    bitmap: null,
    detailCache: new Map(),
    detailToken: 0,
    detailRequestKey: "",
    detailTimer: null,
    detailInflightTiles: new Set(),
    detailLoadedTiles: new Set(),
    detailFailedTiles: new Map(),
    loadToken: 0,
    players: [],
    playersToken: 0,
    playersLoading: false,
    pendingJump: null,
    pointer: null,
    trimMode: false,
    trimAreas: [],
    trimDraft: null,
    trimAnchor: null,
    drawingTrim: false
  },
  selectedServerId: "",
  options: null,
  busy: false,
  renderedPage: "",
  renderedDashboardInstalled: null,
  renderedDashboardRunning: null,
  commandHistory: [],
  commandHistoryIndex: -1,
  history: {
    tps: [],
    players: [],
    cpu: [],
    memory: [],
    disk: []
  }
};

const pages = [
  ["dashboard", "Dashboard"],
  ["servers", "Servers"],
  ["setup", "Setup"],
  ["backups", "Backups"],
  ["mods", "Mods"],
  ["updates", "Updates"],
  ["world", "World"],
  ["files", "Files"],
  ["settings", "Settings"],
  ["termux", "Termux"],
  ["console", "Console"]
];
if (!pages.some(([id]) => id === state.page)) state.page = "dashboard";

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = value => Number(value || 0).toFixed(value > 10 ? 0 : 1) + "%";
const bytes = value => {
  value = Number(value || 0);
  const units = ["B", "KB", "MB", "GB", "TB"];
  let index = 0;
  while (value >= 1024 && index < units.length - 1) { value /= 1024; index++; }
  return `${value.toFixed(index ? 1 : 0)} ${units[index]}`;
};
const q = params => new URLSearchParams(params).toString();
const RAM_STEPS = [1024, 1536, 2048, 2560, 3072, 4096, 5120, 6144, 8192];
const WORLD_LIMIT_STEPS = [1000, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000];
const WORLD_MIN_SCALE = 0.025;
const WORLD_MAX_SCALE = 48;
const WORLD_DETAIL_SCALE = WORLD_MIN_SCALE;
const WORLD_DETAIL_LIMIT = 5000;
const WORLD_DETAIL_TILE_CHUNKS = 32;
const WORLD_DETAIL_CONCURRENCY = 3;
const WORLD_DETAIL_RETRY_MS = 8000;
const formatRam = value => value % 1024 === 0 ? `${value / 1024} GB` : `${(value / 1024).toFixed(1)} GB`;
function closestRamIndex(value) {
  value = Number(value || RAM_STEPS[2]);
  let best = 0;
  let distance = Infinity;
  RAM_STEPS.forEach((option, index) => {
    const nextDistance = Math.abs(option - value);
    if (nextDistance < distance) {
      best = index;
      distance = nextDistance;
    }
  });
  return best;
}
function setupMemoryValue() {
  const slider = $("setup-memory");
  const index = Math.max(0, Math.min(RAM_STEPS.length - 1, Number(slider?.value || 0)));
  return RAM_STEPS[index] || RAM_STEPS[2];
}
function updateSetupMemoryReadout() {
  const readout = $("setup-memory-readout");
  if (readout) readout.textContent = `${formatRam(setupMemoryValue())} (${setupMemoryValue()} MB)`;
}
function closestWorldLimitIndex(value) {
  value = Number(value || WORLD_LIMIT_STEPS[2]);
  let best = 0;
  let distance = Infinity;
  WORLD_LIMIT_STEPS.forEach((option, index) => {
    const nextDistance = Math.abs(option - value);
    if (nextDistance < distance) {
      best = index;
      distance = nextDistance;
    }
  });
  return best;
}
function worldLimitValue() {
  const slider = $("world-limit-slider");
  const index = Math.max(0, Math.min(WORLD_LIMIT_STEPS.length - 1, Number(slider?.value || closestWorldLimitIndex(state.world.limit))));
  return WORLD_LIMIT_STEPS[index] || WORLD_LIMIT_STEPS[2];
}
function updateWorldLimitReadout() {
  const readout = $("world-limit-readout");
  if (readout) readout.textContent = `${formatDownloads(state.world.limit)} chunks`;
}
const api = async (path, opts = {}) => {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let error = await res.text();
    try { error = JSON.parse(error).error || error; } catch {}
    throw new Error(error);
  }
  return res.headers.get("content-type")?.includes("application/json") ? res.json() : res.text();
};
const post = (path, body = {}) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const del = path => api(path, { method: "DELETE" });

function notice(message, error = false) {
  const box = $("notice");
  box.textContent = message;
  box.className = "notice" + (error ? " error" : "");
  clearTimeout(notice.timer);
  notice.timer = setTimeout(() => box.classList.add("hidden"), 3800);
}

function goPage(page, shouldRefresh = false) {
  if (!pages.some(([id]) => id === page)) return;
  state.page = page;
  state.renderedPage = "";
  const params = new URLSearchParams(location.search);
  if (page === "dashboard") params.delete("page"); else params.set("page", page);
  const next = params.toString();
  history.replaceState(null, "", location.pathname + (next ? "?" + next : ""));
  render();
  if (shouldRefresh) refresh(true);
}

function resetServerScopedState(options = {}) {
  state.updates = null;
  state.mods = null;
  state.files = [];
  state.world.data = null;
  state.world.bitmap = null;
  state.world.centered = false;
  state.world.trimAreas = [];
  state.world.trimDraft = null;
  state.world.trimAnchor = null;
  state.world.drawingTrim = false;
  if (!options.keepFiles) {
    state.filePath = "";
    state.fileEditor = null;
  }
}

function selectServer(id, options = {}) {
  if (!id || state.selectedServerId === id) return;
  state.selectedServerId = id;
  resetServerScopedState(options);
}

function emptyState(title, body, actions = "") {

function runtimeLabel(loader) {
  loader = (loader || "-").toLowerCase();
  if (loader === "neoforge") return "NF";
  if (loader === "vanilla") return "V";
  return loader.slice(0, 1).toUpperCase();
}

function statusLabel(server = {}) {
  if (server.stopping) return ["Stopping", "red"];
  if (server.starting || (server.running && !server.ready)) return ["Starting", "green"];
  if (server.running && server.ready) return ["Running", "green"];
  if (server.installed) return ["Ready", ""];
  return ["Needs setup", "red"];
}

function renderNav() {
  $("nav").innerHTML = pages.map(([id, label]) => `<button class="nav ${state.page === id ? "active" : ""}" data-page="${id}">${label}</button>`).join("");

}

function renderHeaderServerSwitcher() {
  const select = $("server-switcher");
  if (!select) return;
  if (!state.servers.length) {
    select.classList.add("hidden");
    return;
  }
  if (!state.selectedServerId || !state.servers.some(server => server.id === state.selectedServerId)) {
    selectServer(state.servers.find(server => server.active)?.id || state.servers[0].id);
  }
  select.classList.remove("hidden");
  const html = state.servers.map(server => {
    const label = `${server.active ? "Active: " : ""}${server.name || server.id}`;
    return `<option value="${esc(server.id)}" ${server.id === state.selectedServerId ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  if (select.innerHTML !== html) select.innerHTML = html;
  if (select.value !== state.selectedServerId) select.value = state.selectedServerId;
  select.onchange = () => {
    selectServer(select.value);
    render();
    refresh(true);
  };
}

async function refresh(forceRender = false) {
  try {
    const previousInstalled = state.status?.server?.installed ?? null;
    const previousRunning = state.status?.server?.running ?? null;
    state.status = await api("/api/status");
    sampleHistory();
    $("controller-pill").innerHTML = `<span class="dot"></span>Online`;
    $("controller-pill").className = "pill green";
    if (["servers", "dashboard", "settings", "setup", "mods", "updates", "files", "world", "termux"].includes(state.page)) {
      const data = await api("/api/servers");
      state.servers = data.servers || [];
      if (!state.selectedServerId && data.activeServerId) state.selectedServerId = data.activeServerId;
    }
    renderHeaderServerSwitcher();
    if (state.page === "servers" || state.page === "backups") state.backups = (await api("/api/backups")).backups || [];
    if (state.page === "mods") {
      try { state.mods = await api("/api/mods?" + q({ serverId: selectedServerIdForApi() })); } catch { state.mods = { installed: [] }; }
      try { state.modProviders = await api("/api/mods/providers"); } catch { state.modProviders = null; }
    }
    if (state.page === "updates") await loadUpdatePlan(false);
    if (state.page === "servers" && state.selectedServerId) {
      try { state.modsByServer[state.selectedServerId] = await api("/api/mods?" + q({ serverId: state.selectedServerId })); } catch { state.modsByServer[state.selectedServerId] = { installed: [] }; }
    }
    if (state.page === "files") await loadFiles(false);
    const installed = state.status?.server?.installed ?? false;
    const running = state.status?.server?.running ?? false;
    if (forceRender || state.renderedPage !== state.page || previousInstalled !== installed || previousRunning !== running) {
      render();
    } else {
      updateLivePage();
    }
  } catch (error) {
    $("controller-pill").innerHTML = `<span class="dot"></span>Offline`;
    $("controller-pill").className = "pill red";
    notice(error.message, true);
  }
}

function metric(label, value, color = "", id = "", historyKey = "", max = 100) {
  const graph = historyKey ? `<div class="spark" data-history="${historyKey}" data-max="${max}">${sparkline(state.history[historyKey] || [], max)}</div>` : `<div class="spark empty"></div>`;
  return `<div class="card metric"><h3>${label}</h3><div class="value"${id ? ` id="${id}"` : ""}>${esc(value)}</div>${graph}</div>`;
}

function sampleHistory() {
  const server = state.status?.server || {};
  const profile = state.status?.profile || {};
  pushHistory("tps", Number(server.tps || 0));
  pushHistory("players", Number(server.players || 0));
  pushHistory("cpu", Number(state.status?.system?.cpu?.percent || 0));
  pushHistory("memory", Number(state.status?.system?.memory?.percent || 0));
  const diskLimit = Math.max(Number(server.storageBytes || 0), Number(profile.memoryMb || 1) * 1024 * 1024);
  pushHistory("disk", diskLimit ? Number(server.storageBytes || 0) / diskLimit * 100 : 0);
}

function pushHistory(key, value) {
  if (!Number.isFinite(value)) value = 0;
  state.history[key].push(value);
  if (state.history[key].length > 80) state.history[key].shift();
}

function sparkline(values, max = 100) {
  if (!values || values.length === 0) {
    values = [0];
  }
  const width = 160;
  const height = 34;
  const safeMax = Math.max(1, max, ...values);
  const points = values.map((value, index) => {
    const x = values.length <= 1 ? 0 : index * width / (values.length - 1);
    const y = height - Math.max(0, Math.min(value, safeMax)) / safeMax * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const area = `0,${height} ${points} ${width},${height}`;
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><polygon points="${area}"></polygon><polyline points="${points}"></polyline></svg>`;
}

function updateSparkline(key, max = 100) {
  document.querySelectorAll(`[data-history="${key}"]`).forEach(node => {
    node.innerHTML = sparkline(state.history[key] || [], max);
  });
}

function uptime(seconds) {
  seconds = Number(seconds || 0);
  if (!seconds) return "-";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function playitVisible(playit = {}) {
  return Boolean(playit.enabled || playit.running || playit.claimUrl || playit.address || playit.error);
}

function playitLine(playit = {}) {

  if (playit.error) return `<div class="muted">PlayIt: <span style="color:var(--red);font-weight:800">${esc(playit.error)}</span></div>`;
  if (playit.claimUrl) return `<div class="muted">PlayIt claim: <a class="map-link" href="${esc(playit.claimUrl)}" target="_blank">${esc(playit.claimUrl)}</a></div>`;
  return `<div class="muted">PlayIt: <span style="color:var(--green);font-weight:800">enabled</span></div>`;
}

function playitCard(playit = {}) {
  if (!playitVisible(playit)) return "";
  if (playit.address) {
    return `<div class="card"><div class="between"><div><h2>PlayIt.gg</h2><p class="muted">${esc(playit.mode || "Tunnel")} address</p></div><button data-copy="${esc(playit.address)}">Copy</button></div><div class="item"><b>${esc(playit.address)}</b></div></div>`;
  }

  }

  }
  const control = playit.running ? `<button data-act="playit-agent-stop">Stop Agent</button>` : `<button data-act="playit-agent-start">Start Agent</button>`;
  return `<div class="card"><div class="between"><div><h2>PlayIt.gg</h2><p class="muted">${esc(playit.mode || "Standalone agent")}</p></div>${control}</div><div class="item"><b>${playit.running ? "Agent running" : "Waiting to start"}</b></div></div>`;

function wireDashboardActions() {
  document.querySelectorAll("[data-act]").forEach(button => {
    button.onclick = async () => {
      const act = button.dataset.act;
      try {
        if (act === "start") await run(button, () => post("/api/server/start"));
        if (act === "stop" && confirm("Stop server?")) await run(button, () => post("/api/server/stop"));
        if (act === "restart" && confirm("Restart server?")) await run(button, () => post("/api/server/restart"));
        if (act === "backup") await run(button, () => post("/api/backups/create"));
        if (act === "details") { goPage("servers"); return; }
        if (act === "console-page") { goPage("console"); return; }
        if (act === "updates") { goPage("updates", true); return; }
        if (act === "mods") { goPage("mods", true); return; }
        if (act === "world") { goPage("world", true); return; }
        if (act === "files") { state.filePath = ""; goPage("files", true); return; }
        if (act === "send-dashboard") await sendCommandFromInput("dash-command");
        if (act === "playit-agent-start") await run(button, () => post("/api/playit/agent/start"));
        if (act === "playit-agent-stop") await run(button, () => post("/api/playit/agent/stop"));
        await refresh();
      } catch (error) { notice(error.message, true); }
    };
  });
  wireCopyButtons();
  wireCommandInput("dash-command");
  loadLogs("dash-console");
}

function wireCopyButtons() {
  document.querySelectorAll("[data-copy]").forEach(button => {
    button.onclick = async () => {
      try {
        await navigator.clipboard.writeText(button.dataset.copy || "");
        notice("Copied");
      } catch {
        notice("Copy failed", true);
      }
    };
  });
}

async function run(button, fn) {
  button.disabled = true;
  try { const result = await fn(); notice("Done"); return result; }
  finally { setTimeout(() => button.disabled = false, 1200); }
}

function setupWorldLabel() {

  return state.setupWorldUpload ? (state.setupWorldUpload.fileName || "World uploaded") : "No world uploaded";

function syncSetupWorldUploadControls() {
  setText("setup-world-label", setupWorldLabel());

  if (upload) {
    upload.disabled = state.setupWorldUploading;
    upload.textContent = state.setupWorldUploading ? "Uploading..." : "Upload World ZIP";
  }

  if (clear) clear.disabled = state.setupWorldUploading || !state.setupWorldUpload;

function setupProgressHtml() {
  const progress = state.setupProgress;
  return `<div id="setup-progress-card" class="progress-shell ${progress ? "" : "hidden"}" style="margin-top:12px">
    <div class="between"><div><b id="setup-progress-title">${progress ? "Creating server" : "Ready"}</b><div class="muted" id="setup-progress-detail">Preparing...</div></div><span class="pill green"><span class="dot"></span><span id="setup-progress-eta">Starting</span></span></div>
    <div class="progress-track"><div class="progress-fill" id="setup-progress-fill"></div></div>
    <div class="console" id="setup-console" style="height:220px">Waiting for setup output...</div>
  </div>`;
}

async function wireSetup() {
  let versionRequest = 0;

  const updateReview = () => {
    updateSetupMemoryReadout();
    const loader = $("setup-loader").value;
    const playit = $("setup-playit").checked ? (loader === "paper" ? "Plugin + agent option" : "Standalone agent") : "Off";
    const world = state.setupWorldUploading ? "Uploading world..." : (state.setupWorldUpload ? `Upload: ${state.setupWorldUpload.fileName}` : ($("setup-seed").value ? `Seed: ${$("setup-seed").value}` : "Random seed"));
    $("setup-review").innerHTML = [
      ["Server", `${$("setup-name").value || "Unnamed"} (${setupServerIdValue()})`],
      ["Runtime", `${loader} / ${$("setup-version").value}`],
      ["Resources", `${setupMemoryValue()} MB, ${$("setup-players").value} players`],
      ["Distances", `${$("setup-view").value} view, ${$("setup-sim").value} simulation`],
      ["World", world],
      ["Crossplay", $("setup-crossplay").checked ? ($("setup-floodgate").checked ? "Geyser + Floodgate" : "Geyser") : "Off"],
      ["PlayIt.gg", playit]
    ].map(([label, value]) => `<div class="item compact-item between"><span class="muted">${label}</span><b>${esc(value)}</b></div>`).join("");
  };

  const syncWorldUploadState = () => {
    syncSetupWorldUploadControls();
    updateReview();
  };

  const setLoaderOptions = loaders => {
    const select = $("setup-loader");
    const selected = select.value || "paper";
    if (!Array.isArray(loaders) || !loaders.length) return;
    select.innerHTML = loaders.map(loader => `<option value="${esc(loader.id)}">${esc(loader.name || loader.id)}${loader.supported ? "" : " (coming soon)"}</option>`).join("");
    select.value = Array.from(select.options).some(option => option.value === selected) ? selected : "paper";
  };

  const loadSetupVersions = async (loader, preferredVersion = $("setup-version").value || "latest-compatible") => {
    const requestId = ++versionRequest;
    const version = $("setup-version");
    version.disabled = true;
    try {
      const data = await api("/api/server/options?" + q({ loader }));
      if (requestId !== versionRequest) return;
      state.options = data;
      setLoaderOptions(data.loaders);
      const versions = data.minecraftVersions || data.versions || [];
      const choices = ["latest-compatible"];
      versions.forEach(item => {
        const id = item.id || item.version || "";
        if (id && !choices.includes(id)) choices.push(id);
      });
      version.innerHTML = choices.map(choice => `<option value="${esc(choice)}">${esc(choice)}</option>`).join("");
      version.value = choices.includes(preferredVersion) ? preferredVersion : "latest-compatible";
      if (data.warning) console.warn("MineMux version catalog fallback:", data.warning);
    } catch (error) {
      notice("Could not refresh versions: " + error.message, true);
    } finally {
      if (requestId === versionRequest) {
        version.disabled = false;
        updateReview();
      }
    }
  };

  document.querySelectorAll("[data-memory]").forEach(button => button.onclick = () => {
    $("setup-memory").value = closestRamIndex(button.dataset.memory);
    updateReview();
  });
  $("setup-world-upload-btn").onclick = () => $("setup-world-upload").click();
  $("setup-world-clear").onclick = () => {
    if (state.setupWorldUploading) return;
    state.setupWorldUpload = null;
    syncWorldUploadState();
  };
  ["setup-name", "setup-id", "setup-version", "setup-loader", "setup-seed", "setup-memory", "setup-players", "setup-view", "setup-sim", "setup-crossplay", "setup-floodgate", "setup-playit"].forEach(id => {
    const node = $(id);
    if (node) node.addEventListener("input", updateReview);
    if (node) node.addEventListener("change", updateReview);
  });
  $("setup-loader").addEventListener("change", () => loadSetupVersions($("setup-loader").value, "latest-compatible"));
  await loadSetupVersions($("setup-loader").value, "latest-compatible");
  $("setup-cancel").onclick = () => goPage(state.servers.length ? "servers" : "dashboard");
  $("setup-create").onclick = async () => {
    if (state.setupWorldUploading) return notice("Wait for the world upload to finish first.", true);
    const loaderValue = $("setup-loader").value;
    const body = {
      serverId: setupServerIdValue(),
      name: $("setup-name").value.trim() || "MineMux Server",
      minecraftVersion: $("setup-version").value,
      loader: loaderValue,
      seed: $("setup-seed").value.trim(),
      worldUploadId: state.setupWorldUpload?.worldUploadId || "",
      memoryMb: setupMemoryValue(),
      maxPlayers: Number($("setup-players").value),
      viewDistance: Number($("setup-view").value),
      simulationDistance: Number($("setup-sim").value),
      pendingModrinthProjects: [],
      crossplay: { enabled: $("setup-crossplay").checked, installGeyser: $("setup-crossplay").checked, installFloodgate: $("setup-floodgate").checked, floodgate: $("setup-floodgate").checked, bedrockUdp: 19132 },
      playit: { enabled: $("setup-playit").checked },
      acceptEula: $("setup-eula").checked
    };
    if (!body.acceptEula) return notice("Accept the Minecraft EULA first.", true);
    try {
      startSetupProgress(loaderValue);
      await run($("setup-create"), () => post("/api/server/setup", body));
      finishSetupProgress(true);
      selectServer(body.serverId);
      state.updates = null;
      goPage("servers");
      await refresh(true);
    } catch (error) {
      finishSetupProgress(false);
      notice(error.message, true);
    }
  };
  updateReview();
}

function startSetupProgress(loader) {
  clearInterval(state.setupProgressTimer);
  state.setupProgress = { startedAt: Date.now(), estimateSec: setupEstimateSeconds(loader) };
  const card = $("setup-progress-card");
  if (card) card.classList.remove("hidden");
  updateSetupProgress();
  state.setupProgressTimer = setInterval(updateSetupProgress, 1000);
}

function finishSetupProgress(success) {
  clearInterval(state.setupProgressTimer);
  state.setupProgressTimer = null;
  state.setupProgress = null;
  const title = $("setup-progress-title");
  if (title) title.textContent = success ? "Setup complete" : "Setup failed";
  const eta = $("setup-progress-eta");
  if (eta) eta.textContent = success ? "Done" : "Stopped";
  const fill = $("setup-progress-fill");
  if (fill) fill.style.width = success ? "100%" : "100%";
  loadLogs("setup-console");
}

function setupEstimateSeconds(loader) {
  loader = String(loader || "").toLowerCase();
  if (loader === "forge" || loader === "neoforge") return 420;
  if (loader === "fabric" || loader === "quilt") return 240;
  if (loader === "vanilla") return 120;
  return 180;
}

async function updateSetupProgress() {
  if (!state.setupProgress) return;
  const elapsed = Math.max(0, Math.floor((Date.now() - state.setupProgress.startedAt) / 1000));
  const remaining = Math.max(0, state.setupProgress.estimateSec - elapsed);
  const percent = Math.min(95, Math.max(6, Math.round((elapsed / state.setupProgress.estimateSec) * 100)));
  setText("setup-progress-title", "Creating server");
  setText("setup-progress-detail", `Elapsed ${formatDuration(elapsed)}. Installing runtime, writing files, and adding selected add-ons.`);
  setText("setup-progress-eta", remaining ? `~${formatDuration(remaining)} left` : "Finishing");
  const fill = $("setup-progress-fill");
  if (fill) fill.style.width = percent + "%";
  await loadLogs("setup-console");
}

function formatDuration(seconds) {
  seconds = Math.max(0, Number(seconds || 0));
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return mins ? `${mins}m ${secs}s` : `${secs}s`;
}

function setupServerIdValue() {
  const raw = $("setup-id").value.trim().toLowerCase();
  return raw.replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "") || defaultSetupServerId();
}

function serverAddressBlock(server) {
  const playit = server.server?.playit || {};
  const profile = server.profile || {};
  const lan = server.server?.joinAddress || server.joinAddress || "-";
  const playitEnabled = profile.playit?.enabled || playit.enabled || playitVisible(playit);
  const playitValue = playit.address || playit.claimUrl || "";
  const playitText = playit.address || playit.claimUrl || playit.error || (playitEnabled ? (playit.running ? "Agent running" : "Enabled, agent ready") : "Not enabled for this server");
  const playitControl = playitEnabled && !playit.address
    ? (playit.running ? `<button data-server-act="playit-agent-stop">Stop Agent</button>` : `<button data-server-act="playit-agent-start">Start Agent</button>`)
    : "";
  const playitRow = playitEnabled ? `<div class="item compact-item between">
      <div><b>PlayIt.gg</b><div class="muted">${esc(playitText)}</div></div>
      <div class="row">
        ${playit.claimUrl ? `<a href="${esc(playit.claimUrl)}" target="_blank"><button>Open Claim</button></a>` : ""}
        ${playitValue ? `<button data-copy="${esc(playitValue)}">Copy</button>` : ""}
        ${playitControl}
      </div>
    </div>` : "";
  return `<div class="tight-list">
    <div class="item compact-item between">
      <div><b>LAN address</b><div class="muted">${esc(lan)}</div></div>
      ${lan !== "-" ? `<button data-copy="${esc(lan)}">Copy</button>` : ""}
    </div>
    ${playitRow}
  </div>`;
}

function selectedServer() {
  if (!state.servers.length) return null;
  if (!state.selectedServerId || !state.servers.some(server => server.id === state.selectedServerId)) {
    selectServer(state.servers.find(server => server.active)?.id || state.servers[0].id);
  }
  return state.servers.find(server => server.id === state.selectedServerId) || state.servers[0];
}

function selectedServerIdForApi() {
  return selectedServer()?.id || state.selectedServerId || state.status?.profile?.id || "main";
}

function domId(value) {
  return String(value || "server").replace(/[^A-Za-z0-9_-]/g, "_");
}

function serverStatusPill(server, id = "") {
  const [label, color] = statusLabel(server.server || server);
  return `<span ${id ? `id="${id}"` : ""} class="pill ${color}"><span class="dot"></span>${esc(label)}</span>`;
}

function serverOverviewGrid(server) {
  const profile = server.profile || {};
  const live = server.server || {};
  const players = server.active ? `${live.players || 0} / ${profile.maxPlayers || 0}` : `- / ${profile.maxPlayers || 0}`;
  return `<div class="server-kv-grid">
    <div class="mini-card"><span class="muted">Runtime</span><b>${esc(profile.loader || "-")}</b></div>
    <div class="mini-card"><span class="muted">Players</span><b>${esc(players)}</b></div>
    <div class="mini-card"><span class="muted">Uptime</span><b>${esc(server.active ? uptime(live.uptimeSec) : "-")}</b></div>
    <div class="mini-card"><span class="muted">Storage</span><b>${esc(server.active ? bytes(live.storageBytes) : "Active only")}</b></div>
  </div>`;
}

function serverActionsCard(server) {
  return `<div class="card"><div class="section-head"><div><h2>Controls</h2><p class="muted">Power actions for the selected profile.</p></div></div><div id="server-actions-body">${serverActionsBody(server)}</div></div>`;
}

function serverActionsBody(server) {

        <button class="primary" data-make-active="${esc(server.id)}">Make Active</button>
        ${deleteButton}
      </div>`;
  }
  return `<div class="detail-actions">
    ${live.running ? `<button class="danger" data-server-act="stop">Stop</button>` : `<button class="primary" data-server-act="start">Start</button>`}
    <button data-server-act="restart" ${live.running ? "" : "disabled"}>Restart</button>
    <button data-server-act="backup">Create Backup</button>
    <button data-server-act="updates">Updates</button>

function serverPropertiesCard(server) {
  const profile = server.profile || {};
  const props = profile.properties || {};

    <div class="section-head">
      <div><h2>Server Properties</h2><p class="muted">Saved to this server profile and server.properties.</p></div>
      <button class="primary" data-save-properties>Save</button>
    </div>

      <label>Memory MB<input id="cfg-memory" type="number" min="512" max="8192" value="${profile.memoryMb || 2048}"></label>
      <label>Max Players<input id="cfg-players" type="number" min="1" max="50" value="${profile.maxPlayers || 8}"></label>
      <label>View Distance<input id="cfg-view" type="number" min="2" max="32" value="${profile.viewDistance || 6}"></label>
      <label>Simulation Distance<input id="cfg-sim" type="number" min="2" max="32" value="${profile.simulationDistance || 4}"></label>
      <label>MOTD<input id="cfg-motd" value="${esc(props.motd || "MineMux Server")}"></label>
      <label>Gamemode<select id="cfg-gamemode">${selectOptions(["survival", "creative", "adventure", "spectator"], props.gamemode || "survival")}</select></label>
      <label>Difficulty<select id="cfg-difficulty">${selectOptions(["peaceful", "easy", "normal", "hard"], props.difficulty || "normal")}</select></label>
      <label>PVP<select id="cfg-pvp">${boolOptions(propBool(props, "pvp", true))}</select></label>
      <label>Online Mode<select id="cfg-online">${boolOptions(propBool(props, "online-mode", true))}</select></label>
      <label>Command Blocks<select id="cfg-command-blocks">${boolOptions(propBool(props, "enable-command-block", false))}</select></label>
      <label>Whitelist<select id="cfg-whitelist">${boolOptions(propBool(props, "white-list", false))}</select></label>
    </div>
    <p class="hint" style="margin-bottom:0">Most property changes need a restart before Minecraft applies them.</p>
  </div>`;
}

function selectOptions(values, selected) {
  return values.map(value => `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(value)}</option>`).join("");
}

function boolOptions(selected) {
  return `<option value="true" ${selected ? "selected" : ""}>Enabled</option><option value="false" ${!selected ? "selected" : ""}>Disabled</option>`;
}

function propBool(props, key, fallback) {
  if (props[key] === undefined) return fallback;
  return String(props[key]).toLowerCase() === "true";
}

function serverBackupsCard(server) {
  return `<div class="card">
    <div class="section-head">
      <div><h2>Backups</h2><p class="muted" id="server-backup-stats">${backupStatsHtml(backupsForServer(server))}</p></div>
      <button class="primary" data-server-act="backup" data-server-id="${esc(server.id)}">Create</button>
    </div>
    <div class="detail-actions" style="margin-bottom:10px">
      ${server.active ? `<button data-upload-backup>Upload + Restore</button>` : `<button disabled>Upload + Restore</button>`}
    </div>
    <div class="list" id="server-backup-list">${serverBackupRowsHtml(server)}</div>
  </div>`;
}

function backupsForServer(server) {
  const serverId = server?.id || "";
  return (state.backups || []).filter(backup => {
    const metaServer = backup.meta?.serverId;
    if (metaServer) return metaServer === serverId;
    if (server?.active) return true;
    return String(backup.id || "").startsWith(serverId + "-");
  }).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}

function backupStatsHtml(backups) {
  const locked = backups.filter(backup => backup.locked).length;
  const totalSize = backups.reduce((sum, backup) => sum + Number(backup.sizeBytes || 0), 0);
  return `${backups.length} backups / ${locked} locked / ${bytes(totalSize)}`;
}

function serverBackupRowsHtml(server) {
  const backups = backupsForServer(server);
  return backups.map(backup => serverBackupRow(backup, server)).join("") || emptyState("No backups for this server", "Create a restore point before changing runtime, add-ons, or world files.");
}

function serverBackupRow(backup, server) {
  return `<div class="item compact-item between">
    <div>
      <b>${backup.locked ? "[locked] " : ""}${esc(backup.id)}</b>
      <div class="muted">${bytes(backup.sizeBytes)} / ${new Date(backup.createdAt).toLocaleString()}</div>
      <div class="dim">${backup.automatic ? "Automatic" : "Manual/uploaded"}${backup.meta?.reason ? ` / ${esc(backup.meta.reason)}` : ""}</div>
    </div>
    <div class="row">
      <button data-lock-backup="${esc(backup.id)}" data-locked="${backup.locked ? "true" : "false"}">${backup.locked ? "Unlock" : "Lock"}</button>

function wireModButtons() {
